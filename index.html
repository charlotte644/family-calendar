<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Family Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ec; --card: #ffffff; --ink: #2b2925; --muted: #6f6a61; --line: #e6dfd3;
    --brand: #2f5d50; --brand-soft: #e3eee9;
    --busy: #d8d2c7; --plan: #3f8a6f; --sam: #d9902b; --sam-soft: #fbf0de; --dog: #7d64b3; --dog-soft: #efeaf8;
    --danger: #a8402f; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 'Nunito Sans', system-ui, sans-serif; }
  body { padding: 0 16px 60px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.9rem; margin: 26px 0 2px; letter-spacing: -0.01em; }
  .hello { color: var(--muted); margin: 0 0 16px; }
  button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .btn:hover { border-color: var(--brand); }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.small, .btn.small { padding: 4px 11px; font-size: 0.86rem; }
  button.link { border: 0; background: none; padding: 2px 4px; color: var(--brand); text-decoration: underline; font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: default; }
  .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  details.panel summary { cursor: pointer; font-weight: 700; list-style: none; }
  details.panel summary::before { content: '\25B8'; display: inline-block; width: 1.1em; transition: transform .15s; }
  details.panel[open] summary::before { transform: rotate(90deg); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .week { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 10px; }
  .week strong { font-family: Fraunces, Georgia, serif; font-size: 1.15rem; text-align: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
  .sw { display: inline-block; width: 14px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 5px; }
  .day { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 12px; margin-bottom: 12px; }
  .day.today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .day.past { opacity: 0.6; }
  .dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .dayhead h2 { font-size: 1.05rem; margin: 0; }
  .pill { font-size: 0.82rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
  .pill.full { background: #eee9e1; color: var(--muted); }
  .bar { position: relative; height: 22px; background: #fff; border: 1px solid var(--line); border-radius: 7px; margin: 10px 0 2px; overflow: hidden; }
  .bar span { position: absolute; top: 0; bottom: 0; }
  .bar .b { background: repeating-linear-gradient(-45deg, var(--busy), var(--busy) 5px, #cfc8bc 5px, #cfc8bc 10px); }
  .bar .p { background: var(--plan); }
  .ticks { position: relative; height: 16px; font-size: 0.72rem; color: var(--muted); }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .lines { margin-top: 8px; display: grid; gap: 6px; }
  .line { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; font-size: 0.95rem; }
  .tag { font-size: 0.78rem; font-weight: 700; border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
  .tag.sam { background: var(--sam-soft); color: #8a5a12; }
  .tag.dog { background: var(--dog-soft); color: #54408a; }
  .tag.plan { background: var(--brand-soft); color: var(--brand); }
  .tag.busy { background: #eee9e1; color: var(--muted); }
  .line .what { flex: 1; min-width: 180px; }
  .line .acts { display: flex; gap: 2px; flex-wrap: wrap; }
  .sub { color: var(--muted); font-size: 0.86rem; }
  .dayacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .msg { padding: 12px 14px; border-radius: 10px; margin: 10px 0; background: #fff4e5; border: 1px solid #f0d3a6; }
  .msg.err { background: #fdecea; border-color: #f2c1b9; color: var(--danger); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(460px, calc(100% - 24px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(30, 28, 25, 0.45); }
  dialog form { padding: 18px 18px 16px; }
  dialog h3 { margin: 0 0 12px; font-family: Fraunces, Georgia, serif; font-weight: 600; }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=date], input[type=time], select, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
  textarea { min-height: 64px; resize: vertical; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 600; margin-top: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dlgacts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .free-hint { font-size: 0.86rem; color: var(--brand); margin-top: 6px; }
  .demo { background: #2b2925; color: #fff; padding: 8px 12px; border-radius: 0 0 12px 12px; font-size: 0.85rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .demo button { padding: 3px 10px; font-size: 0.8rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .settings h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 4px 0 8px; }
  .note { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .ok { color: var(--brand); font-weight: 700; } .bad { color: var(--danger); font-weight: 700; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  @media (max-width: 520px) { h1 { font-size: 1.55rem; } .two { grid-template-columns: 1fr; } .week strong { font-size: 1rem; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="demo"></div>
  <h1 id="title">Family calendar</h1>
  <p class="hello" id="hello"></p>
  <div id="top"></div>
  <div id="main"><p class="loading">Loading…</p></div>
</div>
<dialog id="dlg"><form id="dlgform" method="dialog"></form></dialog>
<script src="config.js?v=1"></script>
<script src="mock.js?v=1"></script>
<script>
(function () {
  'use strict';
  const CFG = window.FAMCAL_CONFIG || {}, URL_ = CFG.SCRIPT_URL || '';
  const DEMO = !URL_;
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- the private link code (from #k=..., remembered on this device) ----------
  let KEY = '';
  try {
    const m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (m) { KEY = m[1]; localStorage.setItem('famcal_k', KEY); history.replaceState(null, '', location.pathname + location.search); }
    else KEY = localStorage.getItem('famcal_k') || '';
  } catch (e) { const m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash); KEY = m ? m[1] : ''; }
  if (DEMO && !KEY) KEY = 'demo-charlotte-key-00000000';

  // ---------- talking to the web app ----------
  async function api(fn, ...args) {
    if (DEMO) return window.FAMCAL_MOCK(fn, args);
    const r = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Something went wrong.');
    return j.data;
  }

  // ---------- time helpers ----------
  const pad = n => ('0' + n).slice(-2);
  const toMins = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : NaN; };
  const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  function nice(m) { if (typeof m === 'string') m = toMins(m); if (isNaN(m)) return ''; if (m >= 1440) return 'midnight'; const h = Math.floor(m / 60), mm = m % 60; return (((h + 11) % 12) + 1) + (mm ? ':' + pad(mm) : '') + (h < 12 ? 'am' : 'pm'); }
  const range = (a, b) => nice(a) + '–' + nice(b);
  const addDays = (ds, n) => { const p = ds.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10); };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function weekTitle(a, b) {
    const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
    return pa[1] === pb[1] ? pa[2] + '–' + pb[2] + ' ' + MONTHS[pb[1] - 1] : pa[2] + ' ' + MONTHS[pa[1] - 1].slice(0, 3) + ' – ' + pb[2] + ' ' + MONTHS[pb[1] - 1].slice(0, 3);
  }
  function freeWindows(day, V) {
    let free = [[V.dayStart, V.dayEnd]];
    const cut = (a, b) => { const out = []; free.forEach(f => { if (b <= f[0] || a >= f[1]) out.push(f); else { if (a > f[0]) out.push([f[0], a]); if (b < f[1]) out.push([b, f[1]]); } }); free = out; };
    day.busy.forEach(b => cut(b.s, b.e)); day.plans.forEach(p => cut(p.s, p.e));
    return free.filter(f => f[1] - f[0] >= 30);
  }
  function freeText(day, V) {
    const f = freeWindows(day, V);
    if (!f.length) return { text: 'Busy all day', full: true };
    if (f.length === 1 && f[0][0] === V.dayStart && f[0][1] === V.dayEnd) return { text: 'Free all day', full: false };
    return { text: 'Free ' + f.map(w => w[0] === V.dayStart ? 'until ' + nice(w[1]) : w[1] === V.dayEnd ? 'from ' + nice(w[0]) : range(w[0], w[1])).join(', '), full: false };
  }

  // ---------- state ----------
  let V = null, FROM = '', TAB = 'cal', ADMIN = null;
  const boss = () => V && (V.me.role === 'admin' || V.me.role === 'full');
  const childPron = 'him';

  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }

  async function load(from) {
    try {
      V = await api('getView', KEY, from || FROM || '');
      FROM = V.from;
      render();
    } catch (e) {
      $('#main').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
    }
  }

  // ---------- page ----------
  function render() {
    document.title = V.title || 'Family Calendar';
    $('#title').textContent = V.title || 'Family calendar';
    $('#hello').textContent = V.me.role === 'admin' ? 'Your own view: you can see everything, and only you can open Settings.' :
      V.me.role === 'full' ? 'Hi ' + V.me.name + '. You can see everything on here.' :
      'Hi ' + V.me.name + '. Here’s when ' + V.us + ' are free, where ' + V.child + ' and ' + V.dog + ' are, and the plans we’ve got together.';
    let top = '';
    if (V.me.role === 'admin') top += '<div class="tabs"><button data-tab="cal" aria-pressed="' + (TAB === 'cal') + '">Calendar</button><button data-tab="set" aria-pressed="' + (TAB === 'set') + '">People &amp; settings</button></div>';
    $('#top').innerHTML = top;
    if (TAB === 'set' && V.me.role === 'admin') return renderSettings();
    renderCalendar();
  }

  function renderCalendar() {
    let h = subscribePanel();
    h += '<div class="week"><button data-go="back" ' + (V.canBack ? '' : 'disabled') + ' aria-label="Previous week">‹ Back</button><strong>' + esc(weekTitle(V.from, V.to)) + '</strong><button data-go="next" ' + (V.canForward ? '' : 'disabled') + ' aria-label="Next week">Next ›</button></div>';
    h += '<div class="row" style="justify-content:center;margin:-4px 0 12px"><button class="small" data-go="today">Back to today</button></div>';
    h += '<div class="legend"><span><i class="sw" style="background:#fff;border:1px solid var(--line)"></i>Free</span><span><i class="sw" style="background:var(--busy)"></i>' + (boss() ? 'Busy' : 'We’re busy') + '</span><span><i class="sw" style="background:var(--plan)"></i>' + (boss() ? 'Plans with family' : 'Plans with you') + '</span></div>';
    V.days.forEach(d => { h += dayCard(d); });
    $('#main').innerHTML = h;
  }

  function subscribePanel() {
    if (DEMO) return '<details class="panel"><summary>Put this on your own calendar</summary><p class="sub">Once the page is live, this gives you a link your phone’s calendar keeps up to date by itself.</p></details>';
    const feed = URL_ + '?feed=' + encodeURIComponent(KEY), web = feed.replace(/^https:/, 'webcal:');
    const what = boss() ? 'every plan, and who has ' + V.child + ' and ' + V.dog : 'the plans you have with us, and the days you have ' + V.child + ' or ' + V.dog;
    return '<details class="panel"><summary>Put this on your own calendar</summary>' +
      '<p class="sub">This adds ' + esc(what) + ' to your own calendar, and keeps it up to date by itself (it can take a few hours to catch up).</p>' +
      '<div class="row">' +
      '<a class="btn small" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(web) + '">Google Calendar</a>' +
      '<a class="btn small" href="' + esc(web) + '">iPhone / Apple</a>' +
      '<a class="btn small" target="_blank" rel="noopener" href="https://outlook.live.com/calendar/0/addfromweb?url=' + encodeURIComponent(feed) + '&name=' + encodeURIComponent('Family calendar') + '">Outlook</a>' +
      '<button class="small" data-copy="' + esc(feed) + '">Copy the link</button></div>' +
      '<p class="sub" style="margin-bottom:0">Please keep this link to yourself: it is your own.</p></details>';
  }

  function bar(d) {
    const span = V.dayEnd - V.dayStart, pct = m => Math.max(0, Math.min(100, (m - V.dayStart) / span * 100));
    let h = '<div class="bar" aria-hidden="true">';
    d.busy.forEach(b => { if (b.e > V.dayStart && b.s < V.dayEnd) h += '<span class="b" style="left:' + pct(b.s) + '%;width:' + (pct(b.e) - pct(b.s)) + '%"></span>'; });
    d.plans.forEach(p => { if (p.e > V.dayStart && p.s < V.dayEnd) h += '<span class="p" style="left:' + pct(p.s) + '%;width:' + (pct(p.e) - pct(p.s)) + '%"></span>'; });
    h += '</div><div class="ticks" aria-hidden="true">';
    for (let m = Math.ceil(V.dayStart / 180) * 180; m <= V.dayEnd; m += 180) h += '<span style="left:' + pct(m) + '%">' + nice(m) + '</span>';
    return h + '</div>';
  }

  function careLine(kind, d) {
    const list = d[kind], name = kind === 'sam' ? V.child : V.dog, cls = kind === 'sam' ? 'sam' : 'dog';
    if (!list.length) return '<div class="line"><span class="tag ' + cls + '">' + esc(name) + '</span><span class="what">At home with us</span></div>';
    return list.map(c => {
      const when = c.start ? range(c.s, c.e) : 'all day';
      const who = c.mine ? 'with you' : 'with ' + c.name;
      let acts = '';
      if (c.canEdit && !d.past) {
        acts = c.pattern ? '<button class="link small danger" data-drop="' + kind + '|' + d.date + '|' + esc(c.person) + '|">Can’t have ' + childPron + ' this time</button>'
          : '<button class="link small danger" data-drop="' + kind + '|' + d.date + '|' + esc(c.person) + '|' + esc(c.id) + '">Can’t have ' + childPron + ' after all</button>';
      }
      return '<div class="line"><span class="tag ' + cls + '">' + esc(name) + '</span><span class="what">' + esc(who) + ', ' + when + (c.pattern ? ' <span class="sub">(usual day)</span>' : '') + (c.notes ? '<br><span class="sub">' + esc(c.notes) + '</span>' : '') + '</span><span class="acts">' + acts + '</span></div>';
    }).join('');
  }

  function dayCard(d) {
    const ft = freeText(d, V), isToday = d.date === V.today;
    let h = '<article class="day' + (isToday ? ' today' : '') + (d.past ? ' past' : '') + '">';
    h += '<div class="dayhead"><h2>' + (isToday ? 'Today · ' : '') + esc(d.label) + '</h2><span class="pill' + (ft.full ? ' full' : '') + '">' + esc(ft.text) + '</span></div>';
    h += bar(d) + '<div class="lines">';
    h += careLine('sam', d) + careLine('nixon', d);
    d.plans.forEach(p => {
      const when = p.start ? range(p.s, p.e) : 'All day';
      const others = p.withNames.filter((n, i) => p.people[i] !== V.me.id);
      const withTxt = boss() ? (p.withNames.length ? 'with ' + p.withNames.join(', ') : 'just us') : (others.length ? 'also with ' + others.join(', ') : '');
      let acts = '<button class="link small" data-addcal="' + esc(p.id) + '">Add to my calendar</button>';
      if (p.canEdit && !d.past) acts += '<button class="link small" data-move="' + esc(p.id) + '">Change</button><button class="link small danger" data-cancel="' + esc(p.id) + '">Cancel</button>';
      h += '<div class="line"><span class="tag plan">' + esc(when) + '</span><span class="what"><strong>' + esc(p.title) + '</strong>' +
        (p.place ? ' · <a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.place) + '" target="_blank" rel="noopener">' + esc(p.place) + '</a>' : '') +
        (withTxt ? '<br><span class="sub">' + esc(withTxt) + '</span>' : '') + (p.notes ? '<br><span class="sub">' + esc(p.notes) + '</span>' : '') + '</span><span class="acts">' + acts + '</span></div>';
    });
    if (boss()) d.busy.forEach(b => { h += '<div class="line"><span class="tag busy">' + esc(b.s <= 0 && b.e >= 1440 ? 'All day' : range(b.s, b.e)) + '</span><span class="what sub">' + esc(b.t || 'Busy') + '</span></div>'; });
    h += '</div>';
    if (!d.past || boss()) {
      h += '<div class="dayacts"><button class="small" data-plan="' + d.date + '">+ Plan something' + (boss() ? '' : ' with us') + '</button>' +
        '<button class="small" data-have="sam|' + d.date + '">' + (boss() ? 'Someone’s having ' + esc(V.child) : 'I’ll have ' + esc(V.child)) + '</button>' +
        '<button class="small" data-have="nixon|' + d.date + '">' + (boss() ? 'Someone’s having ' + esc(V.dog) : 'I’ll have ' + esc(V.dog)) + '</button></div>';
    }
    return h + '</article>';
  }

  // ---------- dialogs ----------
  const dlg = $('#dlg'), form = $('#dlgform');
  function openDialog(html, onSubmit) {
    form.innerHTML = html + '<div class="msg err" id="dlgerr" hidden></div>';
    form.onsubmit = async ev => {
      ev.preventDefault();
      const btn = form.querySelector('button.primary'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      try { const msg = await onSubmit(new FormData(form)); dlg.close(); if (msg) toast(msg); await load(FROM); }
      catch (e) { const er = $('#dlgerr'); er.textContent = e.message; er.hidden = false; if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label; } }
    };
    form.querySelectorAll('[data-close]').forEach(b => b.onclick = () => dlg.close());
    form.querySelectorAll('button.primary').forEach(b => b.dataset.label = b.textContent);
    dlg.showModal();
  }
  const timeFields = (o) => '<label class="check"><input type="checkbox" name="allDay" ' + (o.allDay ? 'checked' : '') + '> All day</label>' +
    '<div class="two" data-times ' + (o.allDay ? 'hidden' : '') + '><div><label>From</label><input type="time" name="start" step="900" value="' + esc(o.start || '') + '"></div><div><label>Until</label><input type="time" name="end" step="900" value="' + esc(o.end || '') + '"></div></div>';
  function wireAllDay() {
    const cb = form.querySelector('[name=allDay]'), t = form.querySelector('[data-times]');
    if (cb && t) cb.onchange = () => { t.hidden = cb.checked; };
  }
  function freeHint(date) {
    const d = V.days.find(x => x.date === date);
    if (!d || boss()) return '';
    const f = freeWindows(d, V);
    return '<div class="free-hint" data-hint>' + (f.length ? 'We’re free ' + f.map(w => range(w[0], w[1])).join(', ') + ' that day.' : 'We’re busy all day that day, sorry. Try another day.') + '</div>';
  }
  function peopleBoxes(selected) {
    return '<label>Who’s it with?</label>' + V.people.map(p => '<label class="check" style="margin-top:4px"><input type="checkbox" name="people" value="' + esc(p.id) + '" ' + (selected.indexOf(p.id) !== -1 ? 'checked' : '') + '> ' + esc(p.name) + '</label>').join('');
  }

  function planDialog(date, p) {
    const editing = !!p;
    const o = p || { title: '', place: '', notes: '', start: '', end: '', people: [] };
    openDialog('<h3>' + (editing ? 'Change this plan' : boss() ? 'Add a plan' : 'Plan something with us') + '</h3>' +
      '<label>What is it?</label><input type="text" name="title" maxlength="80" required value="' + esc(o.title) + '" placeholder="e.g. Sunday lunch">' +
      '<label>Day</label><input type="date" name="date" required value="' + esc(editing ? p.date : date) + '" min="' + (boss() ? '' : V.today) + '">' +
      (editing || boss() ? '' : freeHint(date)) +
      timeFields({ allDay: editing && !p.start, start: o.start, end: o.end }) +
      '<label>Where? <span class="sub">(optional)</span></label><input type="text" name="place" maxlength="120" value="' + esc(o.place) + '" placeholder="e.g. our house, or a pub name">' +
      '<label>Anything else? <span class="sub">(optional)</span></label><textarea name="notes" maxlength="500">' + esc(o.notes) + '</textarea>' +
      (boss() ? peopleBoxes(o.people) : '') +
      '<div class="dlgacts"><button type="button" data-close>Back</button><button class="primary" type="submit">' + (editing ? 'Save changes' : 'Add it') + '</button></div>',
      async fd => {
        const data = { title: fd.get('title'), date: fd.get('date'), allDay: !!fd.get('allDay'), start: fd.get('start'), end: fd.get('end'), place: fd.get('place'), notes: fd.get('notes') };
        if (boss()) data.people = fd.getAll('people');
        if (editing) { await api('movePlan', KEY, p.id, data); return 'Changed. ' + (V.me.role === 'admin' ? '' : 'We’ll get an email to say so.'); }
        await api('addPlan', KEY, data); return 'Added. ' + (V.me.role === 'admin' ? '' : 'We’ll get an email to say so.');
      });
    wireAllDay();
    const di = form.querySelector('[name=date]'), hint = () => { const h = form.querySelector('[data-hint]'); if (h) h.outerHTML = freeHint(di.value) || '<div data-hint></div>'; };
    if (di) di.onchange = hint;
  }

  function haveDialog(kind, date) {
    const name = kind === 'sam' ? V.child : V.dog;
    openDialog('<h3>' + (boss() ? 'Who’s having ' + esc(name) + '?' : 'Have ' + esc(name)) + '</h3>' +
      (boss() ? '<label>Who</label><select name="person" required>' + V.people.filter(p => p.id !== V.me.id || V.me.role === 'admin').map(p => '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>').join('') + '</select>' : '') +
      '<label>Day</label><input type="date" name="date" required value="' + esc(date) + '" min="' + (boss() ? '' : V.today) + '">' +
      timeFields({ allDay: true }) +
      '<label>Anything we should know? <span class="sub">(optional)</span></label><textarea name="notes" maxlength="500" placeholder="e.g. I can pick him up at 9"></textarea>' +
      '<div class="dlgacts"><button type="button" data-close>Back</button><button class="primary" type="submit">' + (boss() ? 'Save' : 'Yes, I’ll have ' + esc(name)) + '</button></div>',
      async fd => {
        await api('haveCare', KEY, { kind: kind, person: fd.get('person') || '', date: fd.get('date'), allDay: !!fd.get('allDay'), start: fd.get('start'), end: fd.get('end'), notes: fd.get('notes') });
        return boss() ? 'Saved.' : 'Thank you! We’ll get an email to say so.';
      });
    wireAllDay();
  }

  function confirmDialog(title, body, okText, fn) {
    openDialog('<h3>' + esc(title) + '</h3><p>' + body + '</p>' + (okText.note ? '<label>Anything to add? <span class="sub">(optional)</span></label><textarea name="notes" maxlength="500"></textarea>' : '') +
      '<div class="dlgacts"><button type="button" data-close>Back</button><button class="primary" type="submit">' + esc(okText.text) + '</button></div>', fn);
  }

  // ---------- add one plan to your own calendar ----------
  function addCalDialog(p) {
    const ymd = p.date.replace(/-/g, ''), stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const s = p.start ? ymd + 'T' + p.start.replace(':', '') + '00' : ymd, e = p.start ? ymd + 'T' + (p.end || hhmm(p.s + 60)).replace(':', '') + '00' : addDays(p.date, 1).replace(/-/g, '');
    const title = boss() ? p.title : p.title + ' with ' + V.us;
    const g = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title) + '&dates=' + s + '/' + e + '&ctz=Europe/London' +
      (p.place ? '&location=' + encodeURIComponent(p.place) : '') + (p.notes ? '&details=' + encodeURIComponent(p.notes) : '');
    const icsEsc = t => String(t || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Family calendar//EN', 'BEGIN:VEVENT', 'UID:' + p.id + '@family-calendar', 'DTSTAMP:' + stamp,
      p.start ? 'DTSTART;TZID=Europe/London:' + s : 'DTSTART;VALUE=DATE:' + s, p.start ? 'DTEND;TZID=Europe/London:' + e : 'DTEND;VALUE=DATE:' + e,
      'SUMMARY:' + icsEsc(title)].concat(p.place ? ['LOCATION:' + icsEsc(p.place)] : []).concat(p.notes ? ['DESCRIPTION:' + icsEsc(p.notes)] : []).concat(['END:VEVENT', 'END:VCALENDAR']).join('\r\n');
    const href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    openDialog('<h3>Add to my calendar</h3><p>' + esc(p.title) + '<br><span class="sub">' + esc(p.start ? range(p.s, p.e) : 'All day') + '</span></p>' +
      '<div class="row"><a class="btn" target="_blank" rel="noopener" href="' + esc(g) + '">Google Calendar</a><a class="btn" href="' + href + '" download="plan.ics">iPhone, Apple or Outlook</a></div>' +
      '<p class="sub">Tip: “Put this on your own calendar” at the top adds every plan for you, and keeps them up to date.</p>' +
      '<div class="dlgacts"><button type="button" data-close>Done</button></div>', async () => '');
  }

  // ---------- clicks ----------
  document.addEventListener('click', async ev => {
    const t = ev.target.closest('button, a'); if (!t) return;
    const ds = t.dataset;
    if (ds.tab) { TAB = ds.tab; if (TAB === 'set') ADMIN = null; render(); return; }
    if (ds.go === 'back') return load(addDays(FROM, -7));
    if (ds.go === 'next') return load(addDays(FROM, 7));
    if (ds.go === 'today') return load(V.today);
    if (ds.copy) { try { await navigator.clipboard.writeText(ds.copy); toast('Copied.'); } catch (e) { prompt('Copy this:', ds.copy); } return; }
    const findPlan = id => { for (const d of V.days) { const p = d.plans.find(x => x.id === id); if (p) return p; } return null; };
    if (ds.plan) return planDialog(ds.plan, null);
    if (ds.move) return planDialog(null, findPlan(ds.move));
    if (ds.addcal) return addCalDialog(findPlan(ds.addcal));
    if (ds.cancel) {
      const p = findPlan(ds.cancel);
      return confirmDialog('Cancel this plan?', '<strong>' + esc(p.title) + '</strong><br>' + esc(V.days.find(d => d.date === p.date).label) + ', ' + esc(p.start ? range(p.s, p.e) : 'all day'), { text: 'Yes, cancel it' },
        async () => { await api('cancelPlan', KEY, p.id); return 'Cancelled.'; });
    }
    if (ds.have) { const a = ds.have.split('|'); return haveDialog(a[0], a[1]); }
    if (ds.drop) {
      const a = ds.drop.split('|'), name = a[0] === 'sam' ? V.child : V.dog, label = V.days.find(d => d.date === a[1]).label;
      return confirmDialog('Can’t have ' + name + '?', 'No problem. We’ll take ' + name + ' off ' + esc(label) + (boss() ? '' : ' and we’ll get an email to say so') + '.', { text: 'Yes, take it off', note: true },
        async fd => { await api('dropCare', KEY, { kind: a[0], date: a[1], person: a[2], id: a[3], notes: fd.get('notes') || '' }); return 'Done.'; });
    }
    if (ds.newlink) {
      if (!confirm('Give ' + ds.name + ' a new link? Their old link will stop working straight away.')) return;
      ADMIN = await api('adminNewLink', KEY, ds.newlink); renderSettings(); toast('New link made. Copy it and send it to them.'); return;
    }
    if (ds.addrow) { ADMIN.pattern.push({ kind: 'sam', weekday: 1, person: (ADMIN.people[0] || {}).id, start: '', end: '' }); renderSettings(); return; }
    if (ds.delrow) { ADMIN.pattern.splice(+ds.delrow, 1); renderSettings(); return; }
  });

  // ---------- Charlotte's settings ----------
  const WEEKDAYS = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const SETTING_LABELS = { title: 'Page heading', us_label: 'Who “we” are', child_name: 'Little one’s name', dog_name: 'Dog’s name', notify_emails: 'Email me about changes at',
    calendar_ids: 'Calendars that make us busy', ignore_words: 'Never count events containing', allday_busy: 'All-day events make the day busy (yes/no)', day_start: 'Day starts', day_end: 'Day ends', weeks_ahead: 'Weeks ahead family can see', site_url: 'Address of this page' };
  async function renderSettings() {
    if (!ADMIN) {
      $('#main').innerHTML = '<p class="loading">Loading…</p>';
      try { ADMIN = await api('adminGet', KEY); } catch (e) { $('#main').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; return; }
    }
    const A = ADMIN, base = (A.settings.site_url || (location.origin + location.pathname)).replace(/#.*$/, '');
    let h = '<div class="panel settings"><h3>People with a link</h3><p class="sub">Each person has their own private link. Nobody needs a password. “Sees everything” shows what your busy times are (for Tom).</p><table>';
    A.people.forEach(p => {
      h += '<tr data-person="' + esc(p.id) + '"><td style="min-width:150px"><input type="text" name="name" value="' + esc(p.name) + '"><div class="note">' + (p.active ? '' : '<span class="bad">Link switched off</span>') + '</div></td>' +
        '<td><input type="email" name="email" value="' + esc(p.email) + '" placeholder="email (for updates)"><select name="role" style="margin-top:6px"><option value="family"' + (p.role === 'family' ? ' selected' : '') + '>Sees free/busy only</option><option value="full"' + (p.role === 'full' ? ' selected' : '') + '>Sees everything</option></select>' +
        '<label class="check" style="margin-top:6px;font-weight:400"><input type="checkbox" name="active" ' + (p.active ? 'checked' : '') + '> Link works</label></td>' +
        '<td><div class="row" style="flex-direction:column;align-items:stretch"><button class="small primary" data-saveperson="' + esc(p.id) + '">Save</button><button class="small" data-copy="' + esc(base + '#k=' + p.token) + '">Copy link</button><button class="small" data-newlink="' + esc(p.id) + '" data-name="' + esc(p.name) + '">New link</button></div></td></tr>';
    });
    h += '<tr data-person=""><td><input type="text" name="name" placeholder="New person, e.g. Auntie Jo"></td><td><input type="email" name="email" placeholder="email (optional)"><select name="role" style="margin-top:6px"><option value="family">Sees free/busy only</option><option value="full">Sees everything</option></select><input type="checkbox" name="active" checked hidden></td><td><button class="small primary" data-saveperson="">Add</button></td></tr></table></div>';

    h += '<div class="panel settings"><h3>Usual week</h3><p class="sub">Who normally has ' + esc(A.settings.child_name) + ' or ' + esc(A.settings.dog_name) + ' each week. Leave the times blank for all day. Family can say “can’t have him this time” for one day without changing this.</p><table>';
    A.pattern.forEach((r, i) => {
      h += '<tr data-pat="' + i + '"><td><select name="kind"><option value="sam"' + (r.kind === 'sam' ? ' selected' : '') + '>' + esc(A.settings.child_name) + '</option><option value="nixon"' + (r.kind === 'nixon' ? ' selected' : '') + '>' + esc(A.settings.dog_name) + '</option></select></td>' +
        '<td><select name="weekday">' + WEEKDAYS.slice(1).map((w, j) => '<option value="' + (j + 1) + '"' + (r.weekday === j + 1 ? ' selected' : '') + '>' + w + '</option>').join('') + '</select></td>' +
        '<td><select name="person">' + A.people.map(p => '<option value="' + esc(p.id) + '"' + (r.person === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></td>' +
        '<td><input type="time" name="start" value="' + esc(r.start) + '" step="900"><input type="time" name="end" value="' + esc(r.end) + '" step="900" style="margin-top:4px"></td>' +
        '<td><button class="small danger" data-delrow="' + i + '" aria-label="Remove">✕</button></td></tr>';
    });
    h += '</table><div class="row" style="margin-top:10px"><button class="small" data-addrow="1">+ Add a day</button><button class="small primary" data-savepattern="1">Save usual week</button></div></div>';

    h += '<div class="panel settings"><h3>Settings</h3>';
    Object.keys(SETTING_LABELS).forEach(k => {
      h += '<label>' + esc(SETTING_LABELS[k]) + '</label><input type="text" data-setting="' + k + '" value="' + esc(A.settings[k]) + '">' + (A.notes[k] ? '<div class="note">' + esc(A.notes[k]) + '</div>' : '');
    });
    h += '<p style="margin:14px 0 6px"><strong>Calendar check</strong></p>' + A.calendars.map(c => '<div>' + (c.ok ? '<span class="ok">✓</span> ' : '<span class="bad">✕</span> ') + esc(c.id) + (c.ok ? ' <span class="sub">(' + esc(c.name) + ')</span>' : ' <span class="sub">— not shared with this Google account yet</span>') + '</div>').join('');
    h += '<div class="row" style="margin-top:12px"><button class="primary small" data-savesettings="1">Save settings</button></div>';
    h += '<p class="sub">Your own link (keep it private): <button class="link small" data-copy="' + esc(base + '#k=' + KEY) + '">copy</button></p></div>';
    $('#main').innerHTML = h;
  }
  document.addEventListener('click', async ev => {
    const t = ev.target.closest('button'); if (!t || !ADMIN) return;
    try {
      if (t.dataset.saveperson !== undefined) {
        const tr = t.closest('tr'), g = n => tr.querySelector('[name=' + n + ']');
        ADMIN = await api('adminSavePerson', KEY, { id: t.dataset.saveperson, name: g('name').value, email: g('email').value, role: g('role').value, active: g('active').checked });
        renderSettings(); toast('Saved.');
      } else if (t.dataset.savepattern) {
        const rows = [...document.querySelectorAll('tr[data-pat]')].map(tr => { const g = n => tr.querySelector('[name=' + n + ']').value; return { kind: g('kind'), weekday: +g('weekday'), person: g('person'), start: g('start'), end: g('end') }; });
        ADMIN = await api('adminSavePattern', KEY, rows); renderSettings(); toast('Usual week saved.'); V = null; await loadQuiet();
      } else if (t.dataset.savesettings) {
        const o = {}; document.querySelectorAll('[data-setting]').forEach(i => { o[i.dataset.setting] = i.value; });
        ADMIN = await api('adminSaveSettings', KEY, o); renderSettings(); toast('Settings saved.'); await loadQuiet();
      }
    } catch (e) { toast(e.message); }
  });
  // Keep the pattern rows in memory while editing, so "+ Add a day" does not lose changes.
  document.addEventListener('change', ev => {
    const tr = ev.target.closest && ev.target.closest('tr[data-pat]'); if (!tr || !ADMIN) return;
    const r = ADMIN.pattern[+tr.dataset.pat], n = ev.target.name; if (!r) return;
    r[n] = n === 'weekday' ? +ev.target.value : ev.target.value;
  });
  async function loadQuiet() { try { V = await api('getView', KEY, FROM); } catch (e) { /* page shows the error next time */ } }

  // ---------- start ----------
  if (!KEY) { $('#main').innerHTML = '<div class="msg">Please open this page using the personal link you were sent.</div>'; return; }
  window.FAMCAL_RELOAD = k => { KEY = k; TAB = 'cal'; ADMIN = null; FROM = ''; load(); };
  load();
})();
</script>
</body>
</html>
