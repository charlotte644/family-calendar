<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #f7f3ec; --card: #ffffff; --ink: #2b2925; --muted: #6f6a61; --line: #e6dfd3;
    --brand: #2f5d50; --brand-soft: #e3eee9;
    --busy: #d8d2c7; --plan: #3f8a6f; --free: #e4f1ea; --sam: #d9902b; --sam-soft: #fbf0de; --dog: #7d64b3; --dog-soft: #efeaf8;
    --danger: #a8402f; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 'Nunito Sans', system-ui, sans-serif; }
  body { padding: 0 16px 60px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  .wrap.wide { max-width: 1160px; }
  html.big { font-size: 18.5px; } html.big body { font-size: 18.5px; } html.big .sub, html.big .when { font-size: 0.95rem; } html.big .dayacts button { font-size: 0.95rem; padding: 8px 14px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin: -6px 0 12px; }
  .weekcard { background: var(--brand); color: #fff; border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; }
  .weekcard h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0 0 8px; font-size: 1.4rem; }
  .weekcard ul { margin: 0 0 12px; padding-left: 20px; font-size: 1.08rem; line-height: 1.7; }
  .weekcard p { margin: 0 0 12px; }
  .weekcard button { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.35); }
  .weekcard button.primary { background: #fff; color: var(--brand); padding: 2px 10px; font-size: 0.85rem; margin-left: 6px; }
  .banner { background: #fdf1d8; border: 1px solid #f0d3a6; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .banner.soft { background: #fffaf0; }
  .banner.needs { background: var(--free); border-color: #c9e0d5; } .banner.needs ul { margin: 6px 0 0; padding-left: 18px; }
  .banner.tobook ul { margin: 6px 0 0; padding-left: 18px; } .banner.tobook li { margin-bottom: 4px; }
  .weekcard .asked { background: rgba(255,255,255,.12); border-radius: 10px; padding: 6px 10px; font-size: 0.95rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
  .filters button { font-size: 0.75rem; padding: 3px 9px; } .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .comments { margin-top: 6px; padding: 6px 10px; background: var(--bg); border-radius: 10px; font-size: 0.86rem; display: grid; gap: 3px; }
  .cform { display: flex; gap: 6px; margin-top: 4px; } .cform input { padding: 5px 8px; font-size: 0.86rem; }
  .cardsec h4 { margin: 12px 0 2px; font-size: 0.85rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); } .cardsec p { margin: 0; }
  .dayacts button.ot { background: #fdf1d8; color: #8a5a12; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .side-in { padding: 14px 14px 16px; }
  .side-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .side-head .row { gap: 6px; flex-wrap: nowrap; }
  .side-in.folded { padding: 10px 14px; }
  .side h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0; font-size: 1.2rem; }
  .side-sub { display: flex; justify-content: space-between; align-items: baseline; } .side-sub h4 { margin-bottom: 0; }
  .side h4 { margin: 18px 0 8px; font-size: 0.8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .idea { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-top: 10px; background: #fffdf9; }
  .idea-t { font-weight: 700; } .idea-t a { color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 4px; }
  .chip { font-size: 0.75rem; font-weight: 700; background: #f1ece4; color: var(--muted); border-radius: 999px; padding: 2px 8px; }
  .chip.ok { background: var(--dog-soft); color: #54408a; } .chip.no { background: #fdecea; color: var(--danger); }
  .idea .row { margin-top: 6px; gap: 4px; }
  .going { margin-top: 6px; font-size: 0.88rem; font-weight: 600; color: var(--brand); }
  .open-tag { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: .03em; background: var(--sam-soft); color: #8a5a12; border-radius: 999px; padding: 1px 8px; margin-right: 4px; vertical-align: 1px; }
  .jump { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: -8px 0 12px; font-size: 0.85rem; }
  .jump label { margin: 0; font-weight: 600; color: var(--muted); white-space: nowrap; } .jump input { width: auto; padding: 5px 8px; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } .side { position: static; max-height: none; order: -1; } }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.9rem; margin: 26px 0 2px; letter-spacing: -0.01em; }
  .hello { color: var(--muted); margin: 0 0 16px; }
  button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .btn:hover { border-color: var(--brand); }
  button.primary, .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.small, .btn.small { padding: 4px 11px; font-size: 0.86rem; }
  button.link { border: 0; background: none; padding: 2px 4px; color: var(--brand); text-decoration: underline; font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: default; }
  .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  details.panel summary { cursor: pointer; font-weight: 700; list-style: none; }
  details.panel summary::before { content: '\25B8'; display: inline-block; width: 1.1em; transition: transform .15s; }
  details.panel[open] summary::before { transform: rotate(90deg); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .week { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 10px; }
  .week strong { font-family: Fraunces, Georgia, serif; font-size: 1.15rem; text-align: center; }
  .vt { display: flex; gap: 6px; justify-content: flex-end; align-items: center; margin: -4px 0 10px; }
  .vt button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .wk-legend { gap: 10px 14px; margin: 0 0 10px; } .wk-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  .wk-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 8px; }
  .wk { min-width: 660px; }
  .wk-row, .wk-body { display: grid; grid-template-columns: 48px repeat(7, minmax(0, 1fr)); }
  .wk-head { border-bottom: 1px solid var(--line); }
  .wk-dh { border: 0; border-radius: 0; background: none; flex-direction: column; gap: 0; padding: 6px 2px; color: var(--muted); font-size: 0.72rem; font-weight: 600; }
  .wk-dh b { font-size: 1.2rem; color: var(--ink); line-height: 1.3; padding: 0 7px; } .wk-dh.today b { background: var(--brand); color: #fff; border-radius: 999px; }
  .wk-all { border-bottom: 1px solid var(--line); } .wk-all .cell { padding: 3px 2px; display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #f1ece4; min-height: 22px; min-width: 0; }
  .wk-gut { font-size: 0.68rem; color: var(--muted); text-align: right; padding: 5px 6px 0 0; }
  .wk-hours { position: relative; padding: 0; } .wk-hours span { position: absolute; right: 6px; transform: translateY(-50%); white-space: nowrap; }
  .wk-col { position: relative; border-left: 1px solid #f1ece4; background-image: linear-gradient(to bottom, #eee7dc 1px, transparent 1px); cursor: pointer; }
  .wk-col.past { background-color: #faf8f4; cursor: default; }
  .ev, .chip-ev { border: 0; border-radius: 6px; padding: 2px 5px; background: var(--c); color: #fff; font-size: 0.7rem; font-weight: 700; line-height: 1.2; text-align: left; overflow: hidden; display: block; }
  .ev { position: absolute; box-sizing: border-box; margin-left: 1px; }
  .chip-ev { white-space: nowrap; text-overflow: ellipsis; width: 100%; }
  .ev.soft, .chip-ev.soft { background: #f1ece4; background: color-mix(in srgb, var(--c) 16%, white); color: var(--ink); border-left: 3px solid var(--c); border-radius: 4px; }
  .ev .ev-t { display: block; overflow: hidden; text-overflow: ellipsis; } .ev .ev-w { display: block; font-weight: 400; opacity: 0.85; }
  .bgbusy { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, #ece6dc 0 6px, #f4f0e9 6px 12px); border-top: 2px solid #c9c2b6; }
  .bgbusy::after { content: 'Busy'; position: absolute; top: 2px; left: 8px; font-size: 0.66rem; font-weight: 700; color: var(--muted); }
  .wbar { position: absolute; left: 0; width: 4px; background: var(--c); border-radius: 0 3px 3px 0; opacity: 0.85; }
  .now { position: absolute; left: 0; right: 0; height: 2px; background: #d93025; z-index: 2; pointer-events: none; }
  .wk-tip { text-align: center; margin: 0 0 14px; }
  .wk.one { min-width: 0; }
  .invite { display: flex; flex-wrap: wrap; gap: 6px; }
  .ichip { display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 7px 12px; border: 2px solid var(--c); border-radius: 999px; font-weight: 600; cursor: pointer; }
  .ichip:has(input:checked) { background: var(--c); color: #fff; }
  .fbar { justify-content: center; align-items: center; margin: 0 0 10px; } .fbar .sub { margin-right: 2px; }
  .mg { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 8px; }
  .mg-head, .mg-body { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .mg-head { font-size: 0.72rem; font-weight: 600; color: var(--muted); text-align: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .mg-cell { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 2px; min-height: 92px; min-width: 0; padding: 4px 3px; border: 0; border-right: 1px solid #f1ece4; border-bottom: 1px solid #f1ece4; border-radius: 0; background: none; font-weight: 400; text-align: left; }
  .mg-cell:hover { background: var(--brand-soft); } .mg-cell.out { background: #faf8f4; } .mg-cell.out .mg-n { color: var(--muted); font-weight: 400; }
  .mg-n { align-self: flex-start; font-size: 0.8rem; font-weight: 700; padding: 0 6px; border-radius: 999px; } .mg-cell.today .mg-n { background: var(--brand); color: #fff; }
  .mg-chip { display: block; font-size: 0.66rem; font-weight: 700; line-height: 1.35; border-radius: 4px; padding: 0 4px; background: var(--c); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mg-chip.soft { background: #f1ece4; background: color-mix(in srgb, var(--c) 16%, white); color: var(--ink); border-left: 3px solid var(--c); }
  .mg-more { font-size: 0.64rem; color: var(--muted); padding-left: 4px; }
  @media (max-width: 520px) { .mg-cell { min-height: 70px; padding: 3px 1px; } .mg-chip { font-size: 0.58rem; padding: 0 2px; } }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; font-size: 0.82rem; color: var(--muted); margin: 4px 0 18px; }
  .sw { display: inline-block; width: 16px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
  .sw.free { background: var(--free); } .sw.busy { background: var(--busy); } .sw.plan { background: var(--plan); }
  /* Week at a glance */
  .strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin: 4px 0 10px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: var(--ink); text-decoration: none; min-width: 0; }
  .tile:hover { border-color: var(--brand); }
  .tile .wd { font-size: 0.68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .tile .num { font-family: Fraunces, Georgia, serif; font-size: 1.35rem; line-height: 1.1; }
  .tile .st { font-size: 0.66rem; font-weight: 700; border-radius: 999px; padding: 1px 6px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tile.s-free .st { background: var(--free); color: var(--brand); }
  .tile.s-part .st { background: #fdf1d8; color: #8a5a12; }
  .tile.s-busy .st { background: #eee9e1; color: var(--muted); }
  .tile .ic { font-size: 0.78rem; height: 1.1em; line-height: 1.1; letter-spacing: 1px; }
  .tile.today { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .tile .sm, .m-today { display: none; }
  .tile.past { opacity: .55; }
  /* One day */
  .day { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 12px; margin-bottom: 12px; scroll-margin-top: 12px; }
  .day.today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .day.past { opacity: 0.6; }
  .date { text-align: center; border-radius: 14px; background: var(--bg); padding: 8px 0 7px; align-self: start; }
  .date .wd { display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .date .num { display: block; font-family: Fraunces, Georgia, serif; font-size: 1.75rem; line-height: 1.05; }
  .date .mo { display: block; font-size: 0.7rem; color: var(--muted); }
  .day.today .date { background: var(--brand); color: #fff; } .day.today .date .wd, .day.today .date .mo { color: #d5e6df; }
  .dayhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dayhead h2 { font-size: 1rem; margin: 0; font-weight: 700; }
  .pill { font-size: 0.8rem; font-weight: 700; padding: 3px 11px; border-radius: 999px; background: var(--free); color: var(--brand); }
  .pill.part { background: #fdf1d8; color: #8a5a12; }
  .pill.full { background: #eee9e1; color: var(--muted); }
  .bar { position: relative; height: 14px; background: var(--free); border-radius: 999px; margin: 12px 0 3px; overflow: hidden; }
  .bar span { position: absolute; top: 0; bottom: 0; }
  .bar .b { background: var(--busy); }
  .bar .p { background: var(--plan); }
  .ticks { position: relative; height: 15px; font-size: 0.68rem; color: var(--muted); margin-bottom: 4px; }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .lines { display: grid; gap: 2px; }
  .line { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid #f1ece4; font-size: 0.93rem; }
  .line:first-child { border-top: 0; }
  .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 0.95rem; }
  .ico.sam { background: var(--sam-soft); } .ico.dog { background: var(--dog-soft); } .ico.plan { background: var(--brand-soft); } .ico.busy { background: #f1ece4; }
  .line .what { min-width: 0; }
  .line .what strong { font-weight: 700; }
  .line .when { color: var(--muted); font-size: 0.84rem; font-variant-numeric: tabular-nums; }
  .line .acts { display: flex; gap: 0; flex-wrap: wrap; justify-content: flex-end; }
  .sub { color: var(--muted); font-size: 0.84rem; }
  .dayacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 10px; border-top: 1px solid #f1ece4; }
  .dayacts button { background: var(--bg); border-color: transparent; font-size: 0.82rem; padding: 5px 11px; }
  .dayacts button:hover { border-color: var(--brand); }
  @media (max-width: 520px) {
    .day { grid-template-columns: 1fr; gap: 6px; padding: 14px 14px 10px; }
    .date { display: none; }
    .m-today { display: inline; color: var(--brand); }
    .tile .lg { display: none; } .tile .sm { display: inline; }
    .line { grid-template-columns: 28px minmax(0, 1fr); } .line .acts { grid-column: 2; justify-content: flex-start; }
    .ico { width: 28px; height: 28px; }
    .tile .num { font-size: 1.1rem; } .tile .st { font-size: 0.6rem; padding: 1px 4px; }
  }
  .msg { padding: 12px 14px; border-radius: 10px; margin: 10px 0; background: #fff4e5; border: 1px solid #f0d3a6; }
  .msg.err { background: #fdecea; border-color: #f2c1b9; color: var(--danger); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(460px, calc(100% - 24px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(30, 28, 25, 0.45); }
  dialog form { padding: 18px 18px 16px; }
  dialog h3 { margin: 0 0 12px; font-family: Fraunces, Georgia, serif; font-weight: 600; }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=date], input[type=time], select, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
  textarea { min-height: 64px; resize: vertical; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 600; margin-top: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dlgacts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .free-hint { font-size: 0.86rem; color: var(--brand); margin-top: 6px; }
  .demo { background: #2b2925; color: #fff; padding: 8px 12px; border-radius: 0 0 12px 12px; font-size: 0.85rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .demo button { padding: 3px 10px; font-size: 0.8rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .settings h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 4px 0 8px; }
  .note { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .ok { color: var(--brand); font-weight: 700; } .bad { color: var(--danger); font-weight: 700; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  @media (max-width: 520px) { h1 { font-size: 1.55rem; } .two { grid-template-columns: 1fr; } .week strong { font-size: 1rem; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="demo"></div>
  <h1 id="title">Family calendar</h1>
  <p class="hello" id="hello"></p>
  <div id="top"></div>
  <div id="main"><p class="loading">Loading…</p></div>
</div>
<dialog id="dlg"><form id="dlgform" method="dialog"></form></dialog>
<script src="config.js?v=1"></script>
<script src="mock.js?v=1"></script>
<script>
(function () {
  'use strict';
  const CFG = window.FAMCAL_CONFIG || {}, URL_ = CFG.SCRIPT_URL || '';
  const DEMO = !URL_;
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- the private link code (from #k=..., remembered on this device) ----------
  let KEY = '';
  try {
    const m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (m) { KEY = m[1]; localStorage.setItem('famcal_k', KEY); }   // the link stays in the address, so "Add to Home Screen" keeps it
    else KEY = localStorage.getItem('famcal_k') || '';
  } catch (e) { const m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash); KEY = m ? m[1] : ''; }
  if (DEMO && !KEY) KEY = 'demo-charlotte-key-00000000';

  // ---------- talking to the web app ----------
  async function api(fn, ...args) {
    if (DEMO) return window.FAMCAL_MOCK(fn, args);
    const r = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Something went wrong.');
    return j.data;
  }

  // ---------- time helpers ----------
  const pad = n => ('0' + n).slice(-2);
  const toMins = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : NaN; };
  const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  function nice(m) { if (typeof m === 'string') m = toMins(m); if (isNaN(m)) return ''; if (m >= 1440) return 'midnight'; const h = Math.floor(m / 60), mm = m % 60; return (((h + 11) % 12) + 1) + (mm ? ':' + pad(mm) : '') + (h < 12 ? 'am' : 'pm'); }
  const range = (a, b) => nice(a) + '–' + nice(b);
  const addDays = (ds, n) => { const p = ds.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10); };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function weekTitle(a, b) {
    const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
    return pa[1] === pb[1] ? pa[2] + '–' + pb[2] + ' ' + MONTHS[pb[1] - 1] : pa[2] + ' ' + MONTHS[pa[1] - 1].slice(0, 3) + ' – ' + pb[2] + ' ' + MONTHS[pb[1] - 1].slice(0, 3);
  }
  function freeWindows(day, V) {
    let free = [[V.dayStart, V.dayEnd]];
    const cut = (a, b) => { const out = []; free.forEach(f => { if (b <= f[0] || a >= f[1]) out.push(f); else { if (a > f[0]) out.push([f[0], a]); if (b < f[1]) out.push([b, f[1]]); } }); free = out; };
    day.busy.forEach(b => { if (!b.n) cut(b.s, b.e); }); day.plans.forEach(p => cut(p.s, p.e));
    return free.filter(f => f[1] - f[0] >= 30);
  }
  function freeText(day, V) {
    const f = freeWindows(day, V);
    if (!f.length) return { text: 'Busy all day', full: true };
    if (f.length === 1 && f[0][0] === V.dayStart && f[0][1] === V.dayEnd) return { text: 'Free all day', full: false };
    return { text: 'Free ' + f.map(w => w[0] === V.dayStart ? 'until ' + nice(w[1]) : w[1] === V.dayEnd ? 'from ' + nice(w[0]) : range(w[0], w[1])).join(', '), full: false };
  }

  // ---------- state ----------
  let V = null, FROM = '', TAB = 'cal', ADMIN = null;
  const boss = () => V && (V.me.role === 'admin' || V.me.role === 'full');
  const childPron = 'him';

  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }

  async function load(from) {
    try {
      V = await api('getView', KEY, from || FROM || '', VIEW === 'month' ? 42 : 7);   // a month is six weeks
      FROM = V.from;
      render();
    } catch (e) {
      $('#main').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
    }
  }

  function unscramble(s) {
    try { const b = atob(s); let o = ''; for (let i = 0; i < b.length; i++) o += String.fromCharCode(b.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)); return o.indexOf('https://charlotte644.github.io/') === 0 ? o : ''; } catch (e) { return ''; }
  }

  // ---------- page ----------
  function render() {
    document.title = V.title || 'Family Calendar';
    document.querySelector('.wrap').classList.toggle('wide', !!V.ideas && TAB === 'cal');
    $('#title').textContent = V.title || 'Family calendar';
    $('#hello').textContent = V.me.role === 'admin' ? 'Your own view: you can see everything, and only you can open Settings.' :
      V.me.role === 'full' ? 'Hi ' + V.me.name + '. You can see everything on here.' :
      'Hi ' + V.me.name + '. Here’s when ' + V.us + ' are free, where ' + V.child + ' and ' + V.dog + ' are, and the plans we’ve got together.';
    // Bigger text: on by default for family links, and anyone can switch it.
    let big = V.me.role === 'family';
    try { const s = localStorage.getItem('famcal_big'); if (s !== null) big = s === '1'; } catch (e) { /* default */ }
    document.documentElement.classList.toggle('big', big);
    // Tom's "Charlotte's Desk" button: the link is scrambled with his own key, so it never sits in this public page as plain text.
    const desk = V.me.role === 'full' ? unscramble('WRJDQkMCTktaDFNGWFoRRAQPA1AfX1BFWRNVHFlXTgdRBUBYW0ERVUxdUhdaFxpFWlsDR15VUhwMVUNcAVoLAlBKXgJSV1ADRw8=') : '';
    let top = '<div class="tools">' + (desk ? '<a class="btn small primary" href="' + esc(desk) + '" target="_blank" rel="noopener">📋 Charlotte’s Desk</a>' : '') + '<button class="small" data-big="1" aria-pressed="' + big + '">' + (big ? 'Smaller text' : 'Bigger text') + '</button>' +
      (V.me.role !== 'family' ? '<button class="small primary" data-addplan="1">＋ Add a plan</button><button class="small" data-card="sam">🧒 ' + esc(V.child) + '’s card</button><button class="small" data-card="nixon">🐶 ' + esc(V.dog) + '’s card</button>' : '') +
      (V.me.role === 'full' ? '<button class="small" data-instr="1">ℹ️ Instructions</button>' : '') + '</div>';
    if (V.me.role === 'admin') top += '<div class="tabs"><button data-tab="cal" aria-pressed="' + (TAB === 'cal') + '">Calendar</button><button data-tab="set" aria-pressed="' + (TAB === 'set') + '">People &amp; settings</button></div>';
    $('#top').innerHTML = top;
    if (TAB === 'set' && V.me.role === 'admin') return renderSettings();
    renderCalendar();
  }

  // ---------- family: a simple "your week" card at the top ----------
  function weekCard() {
    const mine = [];
    V.days.filter(d => !d.past).forEach(d => {
      const day = d.date === V.today ? 'Today' : d.label.split(' ').slice(0, 1)[0] + ' ' + d.label.split(' ')[1];
      ['sam', 'nixon'].forEach(k => d[k].filter(c => c.mine).forEach(c => mine.push('<li><strong>' + esc(day) + '</strong>: you have ' + esc(k === 'sam' ? V.child : V.dog) + (c.start ? ', ' + range(c.s, c.e) : '') + (c.overnight ? ' (overnight)' : '') + '</li>')));
      d.plans.filter(p => p.mine).forEach(p => mine.push('<li><strong>' + esc(day) + '</strong>: ' + esc(p.title) + (p.start ? ', ' + range(p.s, p.e) : '') + '</li>'));
      d.plans.filter(p => p.canJoin).forEach(p => mine.push('<li><strong>' + esc(day) + '</strong>: ' + esc(p.title) + ' — everyone’s welcome <button class="small primary" data-join="' + esc(p.id) + '">Join us</button></li>'));
    });
    const asked = (V.needs || []).length ? '<p class="asked">You’ve asked us to bring: ' + V.needs.map(n => esc(n.item)).join(', ') + '</p>' : '';
    const later = V.from > addDays(V.today, 6);   // she has jumped ahead to another week
    return '<section class="weekcard"><h2>' + (later ? esc(weekTitle(V.from, V.to)) : 'Your week') + '</h2>' + (mine.length ? '<ul>' + mine.join('') + '</ul>' : '<p>Nothing booked with us ' + (later ? 'that' : 'this') + ' week.</p>') + asked +
      '<div class="row"><button class="primary" data-addplan="1">＋ Add a plan</button><button data-card="sam">🧒 ' + esc(V.child) + '’s care card</button><button data-card="nixon">🐶 ' + esc(V.dog) + '’s care card</button>' +
      '<button data-need="1">🛍️ We need more…</button><button data-instr="1">ℹ️ Instructions</button></div></section>';
  }
  // Charlotte and Tom: what carers have asked us to bring
  function needsPanel() {
    if (V.me.role === 'family' || !(V.needs || []).length) return '';
    return '<div class="banner needs"><strong>🛍️ To bring next time</strong><ul>' + V.needs.map(n => '<li>' + esc(n.item) + ' for ' + esc(n.kind === 'nixon' ? V.dog : V.child) +
      ' <span class="sub">(' + esc(n.who) + (n.note ? ': ' + esc(n.note) : '') + ')</span> <button class="link small" data-needdone="' + esc(n.id) + '">Got it ✓</button></li>').join('') + '</ul></div>';
  }
  // Charlotte only: tickets to buy, tables to book 6–8 weeks ahead, and "Interested" ideas with a date to check
  function toBookPanel() {
    if (!(V.toBook || []).length) return '';
    return '<div class="banner tobook"><strong>🎟️ To book</strong><ul>' + V.toBook.map(o => '<li>' + (o.urgent ? '⚠️ ' : '') + esc(o.text) +
      ' <span class="sub">(' + esc(o.sub) + ')</span> ' + (o.url ? '<a class="small" href="' + esc(o.url) + '" target="_blank" rel="noopener">Website</a> ' : '') +
      (o.kind === 'birthday' ? '' : o.kind === 'dated' || o.kind === 'check' ? (o.kind === 'dated' ? '<button class="link small" data-go-idea="' + esc(o.id) + '">We’re going</button>' : '<button class="link small" data-edit-idea="' + esc(o.id) + '">Add the date</button>')
        : (o.kind === 'tbc' ? '<button class="link small" data-goto="' + o.date + '">Move the date</button> ' : '') + '<button class="link small" data-booked="' + esc(o.id) + '">Booked ✓</button>') + '</li>').join('') + '</ul></div>';
  }
  function needDialog() {
    const opts = { sam: ['Nappies', 'Wipes', 'Nappy cream', 'Spare clothes', 'Snacks', 'Milk', 'Calpol'], nixon: ['Dog food', 'Treats', 'Poo bags'] };
    openDialog('<h3>We need more…</h3><p class="sub">Tick what you’re running low on and we’ll bring it next time.</p>' +
      '<label>For</label><select name="kind"><option value="sam">' + esc(V.child) + '</option><option value="nixon">' + esc(V.dog) + '</option></select>' +
      '<div data-opts></div><label>Anything else?</label><input type="text" name="other" maxlength="60" placeholder="e.g. a warmer coat">' +
      '<label>Note <span class="sub">(optional)</span></label><input type="text" name="note" maxlength="200" placeholder="e.g. size 5 nappies">' +
      '<div class="dlgacts"><button type="button" data-close>Back</button><button class="primary" type="submit">Send to Charlotte &amp; Tom</button></div>',
      async fd => {
        const items = fd.getAll('item').concat(fd.get('other') ? [fd.get('other')] : []);
        await api('addNeed', KEY, { kind: fd.get('kind'), items: items, note: fd.get('note') }); return 'Thanks, we’ll bring it next time.';
      });
    const sel = form.querySelector('[name=kind]'), box = form.querySelector('[data-opts]');
    const draw = () => { box.innerHTML = opts[sel.value].map(o => '<label class="check" style="margin-top:6px;font-weight:400"><input type="checkbox" name="item" value="' + esc(o) + '"> ' + esc(o) + '</label>').join(''); };
    sel.onchange = draw; draw();
  }
  function busyBanner() {
    if (!V.freeEvenings) return '';
    const n = V.freeEvenings.length;
    if (n === 0) return '<div class="banner">⚠️ <strong>Busy week:</strong> not one free evening in these seven days.</div>';
    if (n === 1) return '<div class="banner soft">Only one free evening this week: ' + esc(V.days.find(d => d.date === V.freeEvenings[0]).label) + '.</div>';
    return '';
  }
  function homeScreenHelp() {
    return '<details class="panel"><summary>📱 Put this on your phone’s home screen</summary>' +
      '<p><strong>iPhone:</strong> open this page in Safari, tap the Share button (square with an arrow), then <strong>Add to Home Screen</strong>.</p>' +
      '<p><strong>Android:</strong> open it in Chrome, tap the ⋮ menu, then <strong>Add to Home screen</strong> (or Install app).</p>' +
      '<p class="sub" style="margin-bottom:0">It then opens like an app, straight to your own calendar.</p></details>';
  }

  // Three views: day (one day in full, with arrows), week (a column per day) and month.
  function renderCalendar() {
    if (['day', 'week', 'month'].indexOf(VIEW) === -1) VIEW = 'week';
    if (VIEW === 'day' && !V.days.some(d => d.date === DAY)) DAY = V.days.some(d => d.date === V.today) ? V.today : V.from;
    if (VIEW === 'month' && !MONTH) MONTH = V.days[10].date.slice(0, 7);
    let h = (V.me.role === 'family' && VIEW !== 'month' ? weekCard() : '') + toBookPanel() + needsPanel() + (VIEW === 'week' ? busyBanner() : '');
    const title = VIEW === 'day' ? V.days.find(d => d.date === DAY).label : VIEW === 'month' ? MONTHS[+MONTH.slice(5) - 1] + ' ' + MONTH.slice(0, 4) : weekTitle(V.from, V.to);
    h += '<div class="week"><button data-nav="-1" aria-label="Previous ' + VIEW + '">‹</button><strong>' + esc(title) + '</strong><button data-nav="1" aria-label="Next ' + VIEW + '">›</button></div>';
    h += '<div class="vt"><button class="link small" data-nav="today">Today</button>' + ['day', 'week', 'month'].map(v => '<button class="small" data-view="' + v + '" aria-pressed="' + (VIEW === v) + '">' + v[0].toUpperCase() + v.slice(1) + '</button>').join('') + '</div>';
    h += filterBar();
    if (V.canJump) h += '<div class="jump"><label for="jump">Jump to a date</label><input type="date" id="jump" data-jump min="' + addDays(V.today, -28) + '" max="' + esc(V.lastDay) + '" value="' + (VIEW === 'day' ? DAY : V.from) + '"></div>';
    h += weekLegend();
    if (VIEW === 'month') h += monthGrid();
    else if (VIEW === 'day') { const d = V.days.find(x => x.date === DAY); h += weekGrid([d]) + dayCard(d); }
    else h += weekGrid(V.days);
    if (V.ideas) h = '<div class="layout"><div class="cal">' + h + '</div><aside class="side">' + ideasPanel() + '</aside></div>';
    $('#main').innerHTML = h;
  }

  // ---------- week grid: a column per day, hour by hour, one colour per person ----------
  let VIEW = 'week', DAY = '', MONTH = '', FILTER = '';
  try { VIEW = localStorage.getItem('famcal_view') || 'week'; FILTER = localStorage.getItem('famcal_filter') || ''; } catch (e) { /* default */ }
  const remember = () => { try { localStorage.setItem('famcal_view', VIEW); localStorage.setItem('famcal_filter', FILTER); } catch (e) { /* fine */ } };
  // Monday on or before the 1st, so a month is six full weeks
  const monthStart = ym => { const first = ym + '-01', wd = new Date(first + 'T00:00:00Z').getUTCDay(); return addDays(first, -((wd + 6) % 7)); };
  const shiftMonth = (ym, n) => { const y = +ym.slice(0, 4), m = +ym.slice(5) - 1 + n; return new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 7); };
  function goDay(ds) { DAY = ds; return V.days.some(d => d.date === ds) ? render() : load(ds); }
  function nav(step) {
    if (step === 'today') { DAY = V.today; MONTH = V.today.slice(0, 7); return load(VIEW === 'month' ? monthStart(MONTH) : V.today); }
    if (VIEW === 'day') return goDay(addDays(DAY, step));
    if (VIEW === 'month') { MONTH = shiftMonth(MONTH, step); return load(monthStart(MONTH)); }
    return load(addDays(V.from, 7 * step));
  }
  function setView(v) {
    const was = VIEW; VIEW = v; remember();
    if (v === 'day') return goDay(DAY && V.days.some(d => d.date === DAY) ? DAY : V.days.some(d => d.date === V.today) ? V.today : was === 'month' ? MONTH + '-01' : V.from);
    if (v === 'month') { MONTH = (was === 'day' ? DAY : V.days.some(d => d.date === V.today) ? V.today : V.from).slice(0, 7); return load(monthStart(MONTH)); }
    return load(was === 'day' ? DAY : was === 'month' ? (V.today.slice(0, 7) === MONTH ? V.today : MONTH + '-01') : V.from);
  }
  function filterBar() {
    const opts = boss() ? [['', 'Everyone'], ['charlotte', 'Charlotte'], ['tom', 'Tom'], ['sam', V.child], ['nixon', V.dog], ['plans', 'Plans with family']]
        .concat(V.people.filter(p => !p.place && p.id !== 'tom').map(p => [p.id, p.name])).concat(extraPeople())
      : [['', 'Everyone'], ['us', V.us], ['sam', V.child], ['nixon', V.dog], ['plans', 'Plans with us'], ['own', 'My own plans']];
    return '<div class="filters fbar"><span class="sub">Show:</span>' + opts.map(o => '<button class="small' + (FILTER === o[0] ? ' on' : '') + '" data-filter="' + esc(o[0]) + '">' + esc(o[1]) + '</button>').join('') + '</div>';
  }
  function monthGrid() {
    let h = '<div class="mg"><div class="mg-head">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(w => '<span>' + w + '</span>').join('') + '</div><div class="mg-body">';
    V.days.slice(0, 42).forEach(d => {
      const g = gridItems(d), items = g.all.map(x => Object.assign({ ad: true }, x)).concat(g.it.sort((a, b) => a.s - b.s));
      h += '<button class="mg-cell' + (d.date.slice(0, 7) !== MONTH ? ' out' : '') + (d.date === V.today ? ' today' : '') + (d.past ? ' past' : '') + '" data-dayopen="' + d.date + '" aria-label="' + esc(d.label) + '"><span class="mg-n">' + (+d.date.slice(8)) + '</span>' +
        items.slice(0, 3).map(x => '<span class="mg-chip' + (x.soft ? ' soft' : '') + '" style="--c:' + x.col + '">' + (x.ad ? '' : nice(x.s) + ' ') + esc(x.label) + '</span>').join('') +
        (items.length > 3 ? '<span class="mg-more">+' + (items.length - 3) + ' more</span>' : '') + '</button>';
    });
    return h + '</div></div><p class="sub wk-tip">Tap a day to see it in full.</p>';
  }
  // ＋ Add a plan (by the care cards): family choose their own plan or one with us
  function addPlanDialog() {
    const date = VIEW === 'day' ? DAY : V.days.some(d => d.date === V.today) ? V.today : V.from;
    return boss() ? planDialog(date, null) : slotDialog(date, '');
  }
  // One Instructions button: linking their calendar, putting ours on their phone, the home-screen icon
  function instructionsDialog() {
    openDialog('<h3>Instructions</h3>' + linkPanel() + subscribePanel() + homeScreenHelp() + '<div class="dlgacts"><button type="button" data-close>Close</button></div>', async () => '');
    form.querySelectorAll('button:not([type])').forEach(b => { b.type = 'button'; });
  }
  const COL = { charlotte: '#7b4fb8', tom: '#2f73c4', sam: '#c9860c', nixon: '#b8562a', tomsmum: '#2e8f5b', mumdad: '#c7407e', eli: '#14898a', busy: '#9a948a', other: '#5f7f8c' };
  // people who appear on our days without a link of their own (e.g. Eli's school times)
  const extraPeople = () => { const seen = {}; V.days.forEach(d => (d.others || []).forEach(o => { if (o.id && !V.people.some(p => p.id === o.id)) seen[o.id] = o.name; })); return Object.keys(seen).map(id => [id, seen[id]]); };
  const colOf = id => COL[id] || COL.other;
  const idOfName = n => { const p = V.people.find(x => x.name === n); return p ? p.id : /^(Nanay|Tatay)$/.test(n) ? 'mumdad' : ''; };
  // a family plan takes the colour of the family member in it; just us is Charlotte's colour
  const planCol = p => boss() ? colOf((p.people || []).find(id => id !== 'charlotte' && id !== 'tom') || 'charlotte') : colOf('charlotte');
  function weekLegend() {
    const keys = boss() ? [['charlotte', 'Charlotte (solid = work, pale = social)'], ['tom', 'Tom (stripe = at work)'], ['sam', V.child], ['nixon', V.dog]]
        .concat(V.people.filter(p => !p.place && p.id !== 'tom').map(p => [p.id, p.name])).concat(extraPeople())
      : [['busy', V.us + ' busy'], ['charlotte', 'Plans with us'], [V.me.id, 'Your own plans'], ['sam', V.child], ['nixon', V.dog]];
    return '<div class="legend wk-legend">' + keys.map(k => '<span><i style="--c:' + colOf(k[0]) + '"></i>' + esc(k[1]) + '</span>').join('') + '</div>';
  }
  function gridItems(d) {
    const it = [], all = [], bars = [];
    // k = whose it is (for the filter), ks = anyone else it also belongs to; '*' always shows
    const shown = o => !FILTER || o.k === '*' || o.k === FILTER || (o.ks || []).indexOf(FILTER) !== -1;
    const add = (s, e, label, col, o) => {
      o = o || {}; if (!shown(o)) return;
      const x = { s: s, e: e, label: label, col: col, soft: !!o.soft, attrs: o.attrs || '', fit: !!o.fit }; (o.allDay || (s <= 0 && e >= 1440) ? all : it).push(x);
    };
    const bar = o => { if (shown(o)) bars.push(o); };
    if (d.bankHoliday) add(0, 1440, '🏖️ Bank holiday', COL.busy, { soft: true, k: '*' });
    (d.birthdays || []).forEach(b => add(0, 1440, (b.kind === 'anniversary' ? '💐 ' : '🎂 ') + b.name, COL.other, { soft: true, k: '*' }));
    if (boss()) {
      d.busy.forEach(b => {
        if (b.n) return;
        if (b.w) return bar({ s: b.s, e: b.e, label: b.t, col: colOf(b.who), k: b.who });   // usual work hours: a slim stripe, like Google's working hours
        // her own events (they carry an id): tap to invite family
        add(b.s, b.e, (b.c === 'work' ? 'Work: ' : b.c === 'social' ? 'Social: ' : '') + (b.t || 'Busy'), colOf('charlotte'),
          { soft: b.c !== 'work', k: 'charlotte', attrs: b.id && !d.past ? 'data-share="' + esc(b.id) + '" data-title="' + esc(b.t) + '"' : '' });
      });
      (d.work || []).forEach(w => add(0, 1440, '🌴 ' + w.label, colOf(w.who), { soft: true, k: w.who }));
      (d.others || []).forEach(o => {
        const id = o.id || idOfName(o.name), c = colOf(id);
        if (o.notFree) add(0, 1440, o.name + ' not free', c, { k: id });
        o.busy.forEach(b => add(b.s, b.e, o.name + ' busy', c, { soft: true, k: id }));
        (o.shift || []).forEach(b => add(b.s, b.e, o.name + ' ' + (b.l || o.shiftLabel), c, { k: id, fit: true }));   // fit: never stretches the grid's hours
      });
    } else {
      // our busy time is grey shading behind the day, so their own plans sit on top at full width
      d.busy.forEach(b => (b.s <= 0 && b.e >= 1440 ? add(0, 1440, V.us + ' busy', COL.busy, { soft: true, k: 'us' }) : bar({ s: b.s, e: b.e, label: V.us + ' busy', col: COL.busy, bg: true, k: 'us' })));
      (d.own || []).forEach(o => add(o.start ? o.s : 0, o.start ? o.e : 1440, (o.who && o.who !== 'both' ? o.who + ': ' : '') + o.title, colOf(V.me.id),
        { attrs: d.past ? '' : 'data-own="' + esc(o.id) + '"', allDay: !o.start, k: 'own' }));
    }
    d.plans.forEach(p => add(p.start ? p.s : 0, p.start ? p.e : 1440, '📅 ' + p.title, planCol(p),

    return '<details class="panel"><summary>📅 Link your calendar to ours</summary>' +
      '<p>This lets Charlotte and Tom see when you’re busy, just as you can see when they are. They’ll only see “busy”, never what you’re doing.</p>' +
      '<p class="sub">You can do it all on your phone. The Google Calendar app can’t share, so you use the Google Calendar website in your phone’s browser instead.</p><ol>' +
      '<li>On your phone, open <strong>Chrome</strong> (Android) or <strong>Safari</strong> (iPhone) and go to <a href="https://calendar.google.com" target="_blank" rel="noopener">calendar.google.com</a>' + (L.account ? ', signed in as ' + esc(L.account) : '') + '.</li>' +
      '<li>Switch to the full website: <strong>Android:</strong> tap the ⋮ menu (top right) and tick <strong>Desktop site</strong>. <strong>iPhone:</strong> tap <strong>aA</strong> in the address bar, then <strong>Request Desktop Website</strong>.</li>' +
      '<li>Tap the ⚙ cog, then <strong>Settings</strong>. You may need to zoom in with two fingers.</li>' +
      '<li>On the left, under “Settings for my calendars”, tap your name.</li>' +
      '<li>Under “Share with specific people”, tap <strong>Add people</strong>.</li>' +
      '<li>Type <strong>' + esc(L.shareWith) + '</strong>, choose <strong>See only free/busy (hide details)</strong>, then tap <strong>Send</strong>.</li></ol>' +
      '<button class="primary" data-linkcal="1">I’ve done it</button></details>';
  }
  function subscribePanel() {
    if (DEMO) return '<details class="panel"><summary>Put this on your own calendar</summary><p class="sub">Once the page is live, this gives you a link your phone’s calendar keeps up to date by itself.</p></details>';
    const feed = URL_ + '?feed=' + encodeURIComponent(KEY), web = feed.replace(/^https:/, 'webcal:');
    const what = boss() ? 'every plan, and who has ' + V.child + ' and ' + V.dog : 'the plans you have with us, and the days you have ' + V.child + ' or ' + V.dog;
    return '<details class="panel"><summary>Put this on your own calendar</summary>' +
      '<p class="sub">This adds ' + esc(what) + ' to your own calendar, and keeps it up to date by itself (it can take a few hours to catch up).</p>' +
      '<div class="row">' +
      '<a class="btn small" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/r?cid=' + encodeURIComponent(web) + '">Google Calendar</a>' +
      '<a class="btn small" href="' + esc(web) + '">iPhone / Apple</a>' +
      '<a class="btn small" target="_blank" rel="noopener" href="https://outlook.live.com/calendar/0/addfromweb?url=' + encodeURIComponent(feed) + '&name=' + encodeURIComponent('Family calendar') + '">Outlook</a>' +
      '<button class="small" data-copy="' + esc(feed) + '">Copy the link</button></div>' +
      '<p class="sub" style="margin-bottom:0">Please keep this link to yourself: it is your own.</p></details>';
  }

  function bar(d) {
    const span = V.dayEnd - V.dayStart, pct = m => Math.max(0, Math.min(100, (m - V.dayStart) / span * 100));
    let h = '<div class="bar" aria-hidden="true">';
    d.busy.forEach(b => { if (!b.n && b.e > V.dayStart && b.s < V.dayEnd) h += '<span class="b" style="left:' + pct(b.s) + '%;width:' + (pct(b.e) - pct(b.s)) + '%"></span>'; });
    d.plans.forEach(p => { if (p.e > V.dayStart && p.s < V.dayEnd) h += '<span class="p" style="left:' + pct(p.s) + '%;width:' + (pct(p.e) - pct(p.s)) + '%"></span>'; });
    h += '</div><div class="ticks" aria-hidden="true">';
    for (let m = Math.ceil(V.dayStart / 180) * 180; m <= V.dayEnd; m += 180) h += '<span style="left:' + pct(m) + '%">' + nice(m) + '</span>';
    return h + '</div>';
  }

  const line = (ico, cls, what, acts) => '<div class="line"><span class="ico ' + cls + '" aria-hidden="true">' + ico + '</span><div class="what">' + what + '</div>' + (acts ? '<span class="acts">' + acts + '</span>' : '<span></span>') + '</div>';

  function careLine(kind, d) {
    const list = d[kind], name = kind === 'sam' ? V.child : V.dog, cls = kind === 'sam' ? 'sam' : 'dog', ico = kind === 'sam' ? '🧒' : '🐶';
    if (!list.length) return kind === 'nixon' ? '' : line(ico, cls, '<strong>' + esc(name) + '</strong> <span class="sub">is with us</span>', '');   // Nixon is with us unless someone else has him
    return list.map(c => {
      const when = c.start ? range(c.s, c.e) : 'all day';
      const who = c.mine ? 'you' : c.name;
      let acts = '';
      if (c.canEdit && !d.past) {
        acts = c.pattern ? '<button class="link small danger" data-drop="' + kind + '|' + d.date + '|' + esc(c.person) + '|">Can’t this time</button>'
          : '<button class="link small danger" data-drop="' + kind + '|' + d.date + '|' + esc(c.person) + '|' + esc(c.id) + '">Can’t after all</button>';
      }
      return line(ico, cls, '<strong>' + esc(name) + '</strong> is ' + (c.person === 'other' ? 'at' : 'with') + ' <strong>' + esc(who) + '</strong> <span class="when">· ' + when + (c.overnight ? ', overnight' : '') + (c.pattern ? ', usual day' : '') + '</span>' +
        (c.notes ? '<div class="sub">' + esc(c.notes) + '</div>' : ''), acts);
    }).join('');
  }

  function dayCard(d) {
    const ft = freeText(d, V), st = status(d), isToday = d.date === V.today, p = dParts(d.date);
    let h = '<article class="day' + (isToday ? ' today' : '') + (d.past ? ' past' : '') + '" id="d-' + d.date + '">';
    h += '<div class="date"><span class="wd">' + (isToday ? 'Today' : p.wd) + '</span><span class="num">' + p.num + '</span><span class="mo">' + p.mo + '</span></div><div>';
    h += '<div class="dayhead"><h2>' + (isToday ? '<span class="m-today">Today · </span>' : '') + esc(d.label) + '</h2><span class="pill' + (st.cls === 'busy' ? ' full' : st.cls === 'part' ? ' part' : '') + '">' + esc(ft.text) + '</span></div>';
    h += bar(d) + '<div class="lines">';
    if (d.bankHoliday) h += line('🏖️', 'busy', '<strong>Bank holiday</strong>', '');
    (d.birthdays || []).forEach(b => { h += line(b.kind === 'anniversary' ? '💐' : '🎂', 'sam', '<strong>' + esc(b.name) + '’s ' + b.kind + '</strong>' + (b.years ? ' <span class="when">· ' + b.years + (b.kind === 'birthday' ? ' today' : ' years') + '</span>' : '') +
      (b.gift ? '<div class="sub">🎁 Gift idea (only you see this): ' + esc(b.gift) + '</div>' : ''), ''); });
    d.plans.forEach(p => {
      const when = p.start ? range(p.s, p.e) : 'All day';
      const others = p.withNames.filter((n, i) => p.people[i] !== V.me.id);
      let withTxt = boss() ? (p.withNames.length ? 'with ' + p.withNames.join(', ') : '') : (others.length ? 'also with ' + others.join(', ') : '');
      if (p.open) withTxt = p.withNames.length ? (boss() ? 'Joining: ' : 'Coming: ') + p.withNames.map(n => n === V.me.name ? 'you' : n).join(', ') : (boss() ? 'Nobody has joined yet' : '');
      let acts = '';
      if (p.canJoin && !d.past) acts += '<button class="small primary" data-join="' + esc(p.id) + '">Join us</button>';
      if (p.canLeave && !d.past) acts += '<button class="link small danger" data-leave="' + esc(p.id) + '">Can’t come after all</button>';
      if (!p.open || p.mine || boss()) acts += '<button class="link small" data-addcal="' + esc(p.id) + '">Add to calendar</button>';
      if (p.canEdit && !d.past) acts += '<button class="link small" data-move="' + esc(p.id) + '">Change</button><button class="link small danger" data-cancel="' + esc(p.id) + '">Cancel</button>';
      const facts = [p.price ? '💷 ' + esc(p.price) : '', p.dog === 'yes' ? '🐶 Dog friendly' : p.dog === 'no' ? 'No dogs' : '', p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">Website</a>' : ''].filter(Boolean).join(' · ');
      h += line('📅', 'plan', (p.open ? '<span class="open-tag">Everyone welcome</span> ' : '') + '<strong>' + esc(p.title) + '</strong> <span class="when">· ' + esc(when) + '</span>' +
        ((p.place || withTxt) ? '<div class="sub">' + [p.place ? '<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.place) + '" target="_blank" rel="noopener">' + esc(p.place) + '</a>' : '', esc(withTxt)].filter(Boolean).join(' · ') + '</div>' : '') +
        (facts ? '<div class="sub">' + facts + '</div>' : '') +
        (p.notes && !p.open && !p.price && !p.dog ? '<div class="sub">' + esc(p.notes) + '</div>' : '') +
        (p.comments ? '<div class="comments">' + p.comments.map(c => '<div><strong>' + esc(c.who) + ':</strong> ' + esc(c.text) + '</div>').join('') +
          (!d.past ? '<form class="cform" data-cplan="' + esc(p.id) + '"><input type="text" name="c" maxlength="300" placeholder="Add a note for everyone going…"><button class="small">Add</button></form>' : '') + '</div>' : ''), acts);
    });
    (d.own || []).forEach(o => { h += line('🗓', 'plan', '<strong>' + esc((o.who && o.who !== 'both' ? o.who + ': ' : '') + o.title) + '</strong> <span class="when">· ' + esc(o.start ? range(o.s, o.e) : 'All day') + '</span><div class="sub">Your own plan · only you see what it is</div>',
      d.past ? '' : '<button class="link small" data-own="' + esc(o.id) + '">Change</button>'); });
    h += careLine('sam', d) + careLine('nixon', d);
    if (boss()) {
      const work = d.busy.filter(b => b.w), other = d.busy.filter(b => !b.w && !b.n), notes = d.busy.filter(b => b.n);
      if (work.length) h += line('💼', 'busy', '<span class="sub">' + work.map(b => esc(b.t) + ' ' + range(b.s, b.e)).join(' · ') + '</span>', '');
      (d.work || []).forEach(w => { h += line('🌴', 'busy', '<span class="sub">' + esc(w.label) + '</span>', ''); });
      const whenB = b => b.s <= 0 && b.e >= 1440 ? 'all day' : range(b.s, b.e);
      other.forEach(b => { h += line(b.c === 'work' ? '💼' : b.c === 'social' ? '🥂' : '•', 'busy', '<span class="sub">' + (b.c ? '<strong>' + (b.c === 'work' ? 'Work' : 'Social') + ':</strong> ' : '') + esc(b.t || 'Busy') + ' <span class="when">· ' + esc(whenB(b)) + '</span></span>',
        b.id && !d.past ? '<button class="link small" data-share="' + esc(b.id) + '" data-title="' + esc(b.t) + '">Invite family</button>' : ''); });
      notes.forEach(b => { h += line('🗒', 'busy', '<span class="sub">' + esc(b.t) + ' <span class="when">· ' + esc(whenB(b)) + ', note only (not busy)</span></span>', ''); });
      if (!d.past) (d.others || []).forEach(o => {
        // shifts / school first, then calendar busy times, then whether their calendar is linked
        const parts = [], sh = o.shift || [];
        if (sh.length) parts.push(sh.map(b => esc(b.l || o.shiftLabel) + ' ' + esc(whenB(b))).join(', '));
        if (o.busy.length) parts.push('busy ' + o.busy.map(b => esc(whenB(b))).join(', '));
        if (o.notLinked) parts.push('calendar not linked yet'); else if (o.unread) parts.push('can’t read their calendar right now');
        const cal = parts.length ? parts.join(' · ') : 'free all day';
        const shown = o.notFree ? '<strong>not free</strong> (marked by ' + esc(o.notFree) + ')' + (parts.length ? ' · ' + cal : '') : cal;
        h += line('👤', 'busy', '<span class="sub">' + esc(o.name) + ': ' + shown + '</span>',
          o.id && !o.noMark ? '<button class="link small" data-notfree="' + esc(o.id) + '|' + d.date + '|' + (o.notFree ? '0' : '1') + '|' + esc(o.who || '') + '">' + (o.notFree ? 'Undo' : 'Not free') + '</button>' : '');
      });
    }
    h += '</div>';
    if (!d.past || boss()) {
      h += '<div class="dayacts"><button data-plan="' + d.date + '">＋ ' + (boss() ? 'Plan' : 'Plan something with us') + '</button>' +
        (boss() || d.past ? '' : '<button data-addown="' + d.date + '">🗓 Add my own plan</button>') +
        // only offered when he isn't already with someone for the whole day
        (d.sam.some(c => !c.start) ? '' : '<button data-have="sam|' + d.date + '">🧒 ' + (boss() ? 'Who has ' + esc(V.child) : 'I’ll have ' + esc(V.child)) + '</button>') +
        (d.nixon.some(c => !c.start) ? '' : '<button data-have="nixon|' + d.date + '">🐶 ' + (boss() ? esc(V.dog) + '’s not with us' : 'I’ll have ' + esc(V.dog)) + '</button>') +
        ((V.workers || []).length ? '<button data-work="' + d.date + '">💼 ' + (V.me.role === 'admin' ? 'Leave / overtime' : 'Overtime / off') + '</button>' : '') +
        // Tom: one-tap overtime on top of today's hours, or a one-tap shift on a day he isn't working
        (V.me.role === 'full' && !d.past ? (d.myWork ? [60, 120, 180].map(m => '<button class="ot" data-ot="' + d.date + '|' + d.myWork.s + '|' + (d.myWork.e + m) + '">+' + (m / 60) + 'h</button>').join('')
          : '<button class="ot" data-ot="' + d.date + '|420|960">Shift 7am–4pm</button>') : '') + '</div>';
    }
    return h + '</div></article>';
  }

  // ---------- dialogs ----------
  const dlg = $('#dlg'), form = $('#dlgform');
  function openDialog(html, onSubmit) {
    form.innerHTML = html + '<div class="msg err" id="dlgerr" hidden></div>';
    form.onsubmit = async ev => {
      ev.preventDefault();
      const btn = form.querySelector('button.primary'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      try { const msg = await onSubmit(new FormData(form)); dlg.close(); if (msg) toast(msg); await load(FROM); }
      catch (e) { const er = $('#dlgerr'); er.textContent = e.message; er.hidden = false; if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label; } }
    };
    form.querySelectorAll('[data-close]').forEach(b => b.onclick = () => dlg.close());
    form.querySelectorAll('button.primary').forEach(b => b.dataset.label = b.textContent);
    dlg.showModal();
  }
  const timeFields = (o) => '<label class="check"><input type="checkbox" name="allDay" ' + (o.allDay ? 'checked' : '') + '> All day</label>' +
    '<div class="two" data-times ' + (o.allDay ? 'hidden' : '') + '><div><label>From</label><input type="time" name="start" step="900" value="' + esc(o.start || '') + '"></div><div><label>Until</label><input type="time" name="end" step="900" value="' + esc(o.end || '') + '"></div></div>';
  function wireAllDay() {
    const cb = form.querySelector('[name=allDay]'), t = form.querySelector('[data-times]');
    if (cb && t) cb.onchange = () => { t.hidden = cb.checked; };
    // Repeat: the "until" date only shows once a repeat is chosen (3 months ahead to start with)
    const rp = form.querySelector('[name=repeat]'), un = form.querySelector('[data-until]'), di = form.querySelector('[name=date]');
    if (rp && un) rp.onchange = () => { un.hidden = !rp.value; const u = un.querySelector('input'); if (rp.value && !u.value && di.value) u.value = addDays(di.value, 91); };
  }
  const repeatFields = () => '<label>Repeat</label><select name="repeat"><option value="">Does not repeat</option><option value="week">Every week</option><option value="2weeks">Every 2 weeks</option><option value="month">Every month</option></select>' +
    '<div data-until hidden><label>Until</label><input type="date" name="until"></div>';
  const repeatMsg = r => r && r.count > 1 ? ' Added for ' + r.count + ' dates.' + (r.skipped && r.skipped.length ? ' Skipped ' + r.skipped.join(', ') + ' as we already have something on.' : '') : '';
  function freeHint(date) {
    const d = V.days.find(x => x.date === date);
    if (!d || boss()) return '';
    const f = freeWindows(d, V);
    return '<div class="free-hint" data-hint>' + (f.length ? 'We’re free ' + f.map(w => range(w[0], w[1])).join(', ') + ' that day.' : 'We’re busy all day that day, sorry. Try another day.') + '</div>';
  }
  // Tick-box chips for inviting family (Tom already sees everything, so he isn't listed)
  function inviteBoxes(selected) {
    return '<label>Invite</label><div class="invite">' + V.people.filter(p => !p.place && p.id !== 'tom').map(p => '<label class="ichip" style="--c:' + colOf(p.id) + '"><input type="checkbox" name="people" value="' + esc(p.id) + '" ' +
      (selected.indexOf(p.id) !== -1 ? 'checked' : '') + '> ' + esc(p.name) + '</label>').join('') + '</div>';
  }
  function peopleBoxes(selected) {
    return '<label>Who’s it with?</label>' + V.people.filter(p => !p.place).map(p => '<label class="check" style="margin-top:4px"><input type="checkbox" name="people" value="' + esc(p.id) + '" ' + (selected.indexOf(p.id) !== -1 ? 'checked' : '') + '> ' + esc(p.name) + '</label>').join('');
  }

  function planDialog(date, p, start) {
    const editing = !!p;
    const o = p || { title: '', place: '', notes: '', start: start || '', end: start ? hhmm(Math.min(toMins(start) + 60, 1439)) : '', people: [] };
    openDialog('<h3>' + (editing ? 'Change this plan' : boss() ? 'Add a plan' : 'Plan something with us') + '</h3>' +
      '<label>What is it?</label><input type="text" name="title" maxlength="80" required value="' + esc(o.title) + '" placeholder="e.g. Sunday lunch">' +
      (boss() ? inviteBoxes(o.people) : '') +
      '<label>Day</label><input type="date" name="date" required value="' + esc(editing ? p.date : date) + '" min="' + (boss() ? '' : V.today) + '">' +
      (editing || boss() ? '' : freeHint(date)) +
      timeFields({ allDay: editing && !p.start, start: o.start, end: o.end }) + (editing ? '' : repeatFields()) +
      '<label>Where? <span class="sub">(optional)</span></label><input type="text" name="place" maxlength="120" value="' + esc(o.place) + '" placeholder="e.g. our house, or a pub name">' +
      '<label>Anything else? <span class="sub">(optional)</span></label><textarea name="notes" maxlength="500">' + esc(o.notes) + '</textarea>' +
      '<div class="dlgacts"><button type="button" data-close>Back</button><button class="primary" type="submit">' + (editing ? 'Save changes' : 'Add it') + '</button></div>',
      async fd => {
        const data = { title: fd.get('title'), date: fd.get('date'), allDay: !!fd.get('allDay'), start: fd.get('start'), end: fd.get('end'), place: fd.get('place'), notes: fd.get('notes'), repeat: fd.get('repeat') || '', until: fd.get('until') || '' };
        if (boss()) data.people = fd.getAll('people');
        if (editing) { await api('movePlan', KEY, p.id, data); return 'Changed. ' + (V.me.role === 'admin' ? '' : 'We’ll get an email to say so.'); }
        const r = await api('addPlan', KEY, data); return 'Added.' + repeatMsg(r) + (V.me.role === 'admin' ? '' : ' We’ll get an email to say so.');
      });
    wireAllDay();
    const di = form.querySelector('[name=date]'), hint = () => { const h = form.querySelector('[data-hint]'); if (h) h.outerHTML = freeHint(di.value) || '<div data-hint></div>'; };
    if (di) di.onchange = hint;
  }

  function haveDialog(kind, date) {
    const name = kind === 'sam' ? V.child : V.dog;
    openDialog('<h3>' + (boss() ? 'Who’s having ' + esc(name) + '?' : 'Have ' + esc(name)) + '</h3>' +
      (boss() ? '<label>' + (kind === 'nixon' ? 'Where is he?' : 'Who') + '</label><select name="person" required>' +
        // Nixon: the kennels first, then family, then "somewhere else" with a box to say where
        V.people.filter(p => p.id !== V.me.id || V.me.role === 'admin').sort((a, b) => kind === 'nixon' ? b.place - a.place : 0).map(p => '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>').join('') +
        (kind === 'nixon' ? '<option value="other">Somewhere else…</option>' : '') + '</select>' +
        (kind === 'nixon' ? '<div data-where hidden><label>Where?</label><input type="text" name="place" maxlength="120" placeholder="e.g. Sarah’s house"></div>' : '') : '') +
      '<label>Day</label><input type="date" name="date" required value="' + esc(date) + '" min="' + (boss() ? '' : V.today) + '">' +
      timeFields({ allDay: true }) +
      '<label>Anything we should know? <span class="sub">(optional)</span></label><textarea name="notes" maxlength="500" placeholder="e.g. I can pick him up at 9"></textarea>' +
      '<div class="dlgacts"><button type="button" data-close>Back</button><button class="primary" type="submit">' + (boss() ? 'Save' : 'Yes, I’ll have ' + esc(name)) + '</button></div>',
      async fd => {
        await api('haveCare', KEY, { kind: kind, person: fd.get('person') || '', place: fd.get('place') || '', date: fd.get('date'), allDay: !!fd.get('allDay'), start: fd.get('start'), end: fd.get('end'), notes: fd.get('notes') });
        return boss() ? 'Saved.' : 'Thank you! We’ll get an email to say so.';
      });
    wireAllDay();
    const sel = form.querySelector('[name=person]'), where = form.querySelector('[data-where]');
    if (sel && where) sel.onchange = () => { where.hidden = sel.value !== 'other'; where.querySelector('input').required = sel.value === 'other'; };
  }

  // Tom: overtime or a day off. Charlotte: annual leave (for herself or Tom).
  function workDialog(date) {
    const W = V.workers;
    openDialog('<h3>Work hours</h3>' +
      (W.length > 1 ? '<label>Whose?</label><select name="who">' + W.map(w => '<option value="' + esc(w.id) + '">' + esc(w.name) + '</option>').join('') + '</select>' : '<input type="hidden" name="who" value="' + esc(W[0].id) + '">') +
      '<div class="two"><div><label>From</label><input type="date" name="date" required value="' + esc(date) + '"></div><div><label>To <span class="sub">(if more than one day)</span></label><input type="date" name="dateTo" value=""></div></div>' +
      '<label class="check"><input type="radio" name="mode" value="hours" checked> Overtime / different hours</label>' +
      '<div class="two" data-hours><div><label>Start</label><input type="time" name="start" step="900" value="07:00"></div><div><label>Finish</label><input type="time" name="end" step="900" value="18:00"></div></div>' +
      '<label class="check"><input type="radio" name="mode" value="off"> Not working (annual leave, day off)</label>' +
      '<label class="check"><input type="radio" name="mode" value="usual"> Back to usual hours</label>' +
      '<label>Note <span class="sub">(optional, e.g. annual leave)</span></label><input type="text" name="reason" maxlength="40">' +
      '<p class="sub">Family only ever see “busy” or “free”, never the reason.</p>' +
      '<div class="dlgacts"><button type="button" data-close>Back</button><button class="primary" type="submit">Save</button></div>',
      async fd => {
        const r = await api('setWork', KEY, { who: fd.get('who'), date: fd.get('date'), dateTo: fd.get('dateTo'), mode: fd.get('mode'), start: fd.get('start'), end: fd.get('end'), reason: fd.get('reason') });

  // ---------- add one plan to your own calendar ----------

      (p.place ? '&location=' + encodeURIComponent(p.place) : '') + (p.notes ? '&details=' + encodeURIComponent(p.notes) : '');

    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Family calendar//EN', 'BEGIN:VEVENT', 'UID:' + p.id + '@family-calendar', 'DTSTAMP:' + stamp,
      p.start ? 'DTSTART;TZID=Europe/London:' + s : 'DTSTART;VALUE=DATE:' + s, p.start ? 'DTEND;TZID=Europe/London:' + e : 'DTEND;VALUE=DATE:' + e,

    if (ds.work) return workDialog(ds.work);
    if (ds.big) { const on = !document.documentElement.classList.contains('big'); try { localStorage.setItem('famcal_big', on ? '1' : '0'); } catch (e) { } render(); return; }
    if (ds.card) return cardDialog(ds.card);
    if (ds.need) return needDialog();
    if (ds.needdone) { t.disabled = true; try { await api('doneNeed', KEY, ds.needdone); await load(FROM); } catch (e) { toast(e.message); } return; }
    if (ds.ifilter) { IDEA_FILTER = ds.ifilter; render(); return; }
    if (ds.hideideas) { HIDE_IDEAS = !HIDE_IDEAS; try { localStorage.setItem('famcal_hideideas', HIDE_IDEAS ? '1' : '0'); } catch (e) { } render(); return; }
    if (ds.hidegoing) { HIDE_GOING = !HIDE_GOING; try { localStorage.setItem('famcal_hidegoing', HIDE_GOING ? '1' : '0'); } catch (e) { } render(); return; }
    if (ds.linkcal) {
      const on = ds.linkcal === '1'; t.disabled = true;

        const r = await api('linkMyCalendar', KEY, on);

    h += '<div class="row" style="margin-top:12px"><button class="primary small" data-savesettings="1">Save settings</button></div>';
    h += '<p class="sub">Your own link (keep it private): <button class="link small" data-copy="' + esc(base + '#k=' + KEY) + '">copy</button></p></div>';
    $('#main').innerHTML = h;
  }
  document.addEventListener('click', async ev => {
    const t = ev.target.closest('button'); if (!t || !ADMIN) return;
    try {
      if (t.dataset.saveperson !== undefined) {
        const tr = t.closest('tr'), g = n => tr.querySelector('[name=' + n + ']');
        ADMIN = await api('adminSavePerson', KEY, { id: t.dataset.saveperson, name: g('name').value, email: g('email').value, role: g('role').value, active: g('active').checked });
        renderSettings(); toast('Saved.');
      } else if (t.dataset.savepattern) {
        const rows = [...document.querySelectorAll('tr[data-pat]')].map(tr => { const g = n => tr.querySelector('[name=' + n + ']').value; return { kind: g('kind'), weekday: +g('weekday'), person: g('person'), start: g('start'), end: g('end'), from: g('from'), until: g('until'), overnight: tr.querySelector('[name=overnight]').checked }; });
        ADMIN = await api('adminSavePattern', KEY, rows); renderSettings(); toast('Usual week saved.'); V = null; await loadQuiet();
      } else if (t.dataset.saveroutine) {
        const rows = [...document.querySelectorAll('tr[data-rt]')].map(tr => { const g = n => tr.querySelector('[name=' + n + ']').value; return { who: g('who'), weekday: +g('weekday'), start: g('start'), end: g('end'), label: g('label'), rota: g('rota') }; });
        ADMIN = await api('adminSaveRoutine', KEY, rows); renderSettings(); toast('Work hours saved.'); await loadQuiet();
      } else if (t.dataset.savecard) {
        const kind = t.dataset.savecard, secs = [...document.querySelectorAll('[data-card-kind="' + kind + '"]')].map(x => ({ section: x.dataset.section, text: x.value }));
        ADMIN.cards = await api('adminSaveCard', KEY, kind, secs); toast('Care card saved.'); await loadQuiet();
      } else if (t.dataset.savebdays) {
        const rows = [...document.querySelectorAll('tr[data-bday]')].map(tr => { const g = n => tr.querySelector('[name=' + n + ']').value; return { id: tr.dataset.bday, name: g('name'), date: g('date').trim(), kind: g('kind'), gift: g('gift') }; }).filter(r => r.name.trim());
        ADMIN = await api('adminSaveBirthdays', KEY, rows); renderSettings(); toast('Birthdays saved.'); await loadQuiet();
      } else if (t.dataset.savesettings) {
        const o = {}; document.querySelectorAll('[data-setting]').forEach(i => { o[i.dataset.setting] = i.value; });
        ADMIN = await api('adminSaveSettings', KEY, o); renderSettings(); toast('Settings saved.'); await loadQuiet();
      }
    } catch (e) { toast(e.message); }
  });
  // Notes on a plan (people going only, no notifications).
  document.addEventListener('submit', async ev => {
    const f = ev.target.closest && ev.target.closest('form.cform'); if (!f) return;
    ev.preventDefault();
    const v = f.c.value.trim(); if (!v) return;
    f.querySelector('button').disabled = true;
    try { await api('addComment', KEY, f.dataset.cplan, v); await load(FROM); } catch (e) { toast(e.message); f.querySelector('button').disabled = false; }
  });
  // Jump straight to any date (Charlotte and Tom).
  document.addEventListener('change', ev => { if (ev.target.matches && ev.target.matches('[data-jump]') && ev.target.value) {
    const ds = ev.target.value;
    if (VIEW === 'day') goDay(ds); else if (VIEW === 'month') { MONTH = ds.slice(0, 7); load(monthStart(MONTH)); } else load(ds);
  } });
  // Keep the pattern rows in memory while editing, so "+ Add a day" does not lose changes.
  document.addEventListener('change', ev => {
    const tr = ev.target.closest && ev.target.closest('tr[data-pat], tr[data-rt]'); if (!tr || !ADMIN) return;
    const r = tr.dataset.pat !== undefined ? ADMIN.pattern[+tr.dataset.pat] : ADMIN.routine[+tr.dataset.rt], n = ev.target.name; if (!r) return;
    r[n] = n === 'weekday' ? +ev.target.value : ev.target.value;
  });
  async function loadQuiet() { try { V = await api('getView', KEY, FROM, VIEW === 'month' ? 42 : 7); } catch (e) { /* page shows the error next time */ } }

  // ---------- start ----------
  if (!KEY) { $('#main').innerHTML = '<div class="msg">Please open this page using the personal link you were sent.</div>'; return; }
  window.FAMCAL_RELOAD = k => { KEY = k; TAB = 'cal'; ADMIN = null; FROM = ''; load(); };
  load();
})();
</script>
</body>
</html>
