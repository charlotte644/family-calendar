<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Family Calendar</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ec; --card: #ffffff; --ink: #2b2925; --muted: #6f6a61; --line: #e6dfd3;
    --brand: #2f5d50; --brand-soft: #e3eee9;
    --busy: #d8d2c7; --plan: #3f8a6f; --free: #e4f1ea; --sam: #d9902b; --sam-soft: #fbf0de; --dog: #7d64b3; --dog-soft: #efeaf8;
    --danger: #a8402f; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 'Nunito Sans', system-ui, sans-serif; }
  body { padding: 0 16px 60px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  .wrap.wide { max-width: 1160px; }
  html.big { font-size: 18.5px; } html.big body { font-size: 18.5px; } html.big .sub, html.big .when { font-size: 0.95rem; } html.big .dayacts button { font-size: 0.95rem; padding: 8px 14px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin: -6px 0 12px; }
  .weekcard { background: var(--brand); color: #fff; border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; }
  .weekcard h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0 0 8px; font-size: 1.4rem; }
  .weekcard ul { margin: 0 0 12px; padding-left: 20px; font-size: 1.08rem; line-height: 1.7; }
  .weekcard p { margin: 0 0 12px; }
  .weekcard button { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.35); }
  .weekcard button.primary { background: #fff; color: var(--brand); padding: 2px 10px; font-size: 0.85rem; margin-left: 6px; }
  .banner { background: #fdf1d8; border: 1px solid #f0d3a6; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .banner.soft { background: #fffaf0; }
  .banner.needs { background: var(--free); border-color: #c9e0d5; } .banner.needs ul { margin: 6px 0 0; padding-left: 18px; }
  .weekcard .asked { background: rgba(255,255,255,.12); border-radius: 10px; padding: 6px 10px; font-size: 0.95rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 2px; }
  .filters button { font-size: 0.75rem; padding: 3px 9px; } .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .comments { margin-top: 6px; padding: 6px 10px; background: var(--bg); border-radius: 10px; font-size: 0.86rem; display: grid; gap: 3px; }
  .cform { display: flex; gap: 6px; margin-top: 4px; } .cform input { padding: 5px 8px; font-size: 0.86rem; }
  .cardsec h4 { margin: 12px 0 2px; font-size: 0.85rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); } .cardsec p { margin: 0; }
  .dayacts button.ot { background: #fdf1d8; color: #8a5a12; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .side-in { padding: 14px 14px 16px; }
  .side-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .side-head .row { gap: 6px; flex-wrap: nowrap; }
  .side-in.folded { padding: 10px 14px; }
  .side h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0; font-size: 1.2rem; }
  .side-sub { display: flex; justify-content: space-between; align-items: baseline; } .side-sub h4 { margin-bottom: 0; }
  .side h4 { margin: 18px 0 8px; font-size: 0.8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .idea { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-top: 10px; background: #fffdf9; }
  .idea-t { font-weight: 700; } .idea-t a { color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 4px; }
  .chip { font-size: 0.75rem; font-weight: 700; background: #f1ece4; color: var(--muted); border-radius: 999px; padding: 2px 8px; }
  .chip.ok { background: var(--dog-soft); color: #54408a; } .chip.no { background: #fdecea; color: var(--danger); }
  .idea .row { margin-top: 6px; gap: 4px; }
  .going { margin-top: 6px; font-size: 0.88rem; font-weight: 600; color: var(--brand); }
  .open-tag { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: .03em; background: var(--sam-soft); color: #8a5a12; border-radius: 999px; padding: 1px 8px; margin-right: 4px; vertical-align: 1px; }
  .jump { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: -8px 0 12px; font-size: 0.85rem; }
  .jump label { margin: 0; font-weight: 600; color: var(--muted); white-space: nowrap; } .jump input { width: auto; padding: 5px 8px; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } .side { position: static; max-height: none; order: -1; } }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.9rem; margin: 26px 0 2px; letter-spacing: -0.01em; }
  .hello { color: var(--muted); margin: 0 0 16px; }
  button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .btn:hover { border-color: var(--brand); }
  button.primary, .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.small, .btn.small { padding: 4px 11px; font-size: 0.86rem; }
  button.link { border: 0; background: none; padding: 2px 4px; color: var(--brand); text-decoration: underline; font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: default; }
  .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  details.panel summary { cursor: pointer; font-weight: 700; list-style: none; }
  details.panel summary::before { content: '\25B8'; display: inline-block; width: 1.1em; transition: transform .15s; }
  details.panel[open] summary::before { transform: rotate(90deg); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .week { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 10px; }
  .week strong { font-family: Fraunces, Georgia, serif; font-size: 1.15rem; text-align: center; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; font-size: 0.82rem; color: var(--muted); margin: 4px 0 18px; }
  .sw { display: inline-block; width: 16px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
  .sw.free { background: var(--free); } .sw.busy { background: var(--busy); } .sw.plan { background: var(--plan); }
  /* Week at a glance */
  .strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin: 4px 0 10px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px 8px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: var(--ink); text-decoration: none; min-width: 0; }
  .tile:hover { border-color: var(--brand); }
  .tile .wd { font-size: 0.68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .tile .num { font-family: Fraunces, Georgia, serif; font-size: 1.35rem; line-height: 1.1; }
  .tile .st { font-size: 0.66rem; font-weight: 700; border-radius: 999px; padding: 1px 6px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .tile.s-free .st { background: var(--free); color: var(--brand); }
  .tile.s-part .st { background: #fdf1d8; color: #8a5a12; }
  .tile.s-busy .st { background: #eee9e1; color: var(--muted); }
  .tile .ic { font-size: 0.78rem; height: 1.1em; line-height: 1.1; letter-spacing: 1px; }
  .tile.today { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .tile .sm, .m-today { display: none; }
  .tile.past { opacity: .55; }
  /* One day */
  .day { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 12px; margin-bottom: 12px; scroll-margin-top: 12px; }
  .day.today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .day.past { opacity: 0.6; }
  .date { text-align: center; border-radius: 14px; background: var(--bg); padding: 8px 0 7px; align-self: start; }
  .date .wd { display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .date .num { display: block; font-family: Fraunces, Georgia, serif; font-size: 1.75rem; line-height: 1.05; }
  .date .mo { display: block; font-size: 0.7rem; color: var(--muted); }
  .day.today .date { background: var(--brand); color: #fff; } .day.today .date .wd, .day.today .date .mo { color: #d5e6df; }
  .dayhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dayhead h2 { font-size: 1rem; margin: 0; font-weight: 700; }
  .pill { font-size: 0.8rem; font-weight: 700; padding: 3px 11px; border-radius: 999px; background: var(--free); color: var(--brand); }
  .pill.part { background: #fdf1d8; color: #8a5a12; }
  .pill.full { background: #eee9e1; color: var(--muted); }
  .bar { position: relative; height: 14px; background: var(--free); border-radius: 999px; margin: 12px 0 3px; overflow: hidden; }
  .bar span { position: absolute; top: 0; bottom: 0; }
  .bar .b { background: var(--busy); }
  .bar .p { background: var(--plan); }
  .ticks { position: relative; height: 15px; font-size: 0.68rem; color: var(--muted); margin-bottom: 4px; }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .lines { display: grid; gap: 2px; }
  .line { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid #f1ece4; font-size: 0.93rem; }
  .line:first-child { border-top: 0; }
  .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 0.95rem; }
  .ico.sam { background: var(--sam-soft); } .ico.dog { background: var(--dog-soft); } .ico.plan { background: var(--brand-soft); } .ico.busy { background: #f1ece4; }
  .line .what { min-width: 0; }
  .line .what strong { font-weight: 700; }
  .line .when { color: var(--muted); font-size: 0.84rem; font-variant-numeric: tabular-nums; }
  .line .acts { display: flex; gap: 0; flex-wrap: wrap; justify-content: flex-end; }
  .sub { color: var(--muted); font-size: 0.84rem; }
  .dayacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 10px; border-top: 1px solid #f1ece4; }
  .dayacts button { background: var(--bg); border-color: transparent; font-size: 0.82rem; padding: 5px 11px; }
  .dayacts button:hover { border-color: var(--brand); }
  @media (max-width: 520px) {
    .day { grid-template-columns: 1fr; gap: 6px; padding: 14px 14px 10px; }
    .date { display: none; }
    .m-today { display: inline; color: var(--brand); }
    .tile .lg { display: none; } .tile .sm { display: inline; }
    .line { grid-template-columns: 28px minmax(0, 1fr); } .line .acts { grid-column: 2; justify-content: flex-start; }
    .ico { width: 28px; height: 28px; }
    .tile .num { font-size: 1.1rem; } .tile .st { font-size: 0.6rem; padding: 1px 4px; }
  }
  .msg { padding: 12px 14px; border-radius: 10px; margin: 10px 0; background: #fff4e5; border: 1px solid #f0d3a6; }
  .msg.err { background: #fdecea; border-color: #f2c1b9; color: var(--danger); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(460px, calc(100% - 24px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(30, 28, 25, 0.45); }
  dialog form { padding: 18px 18px 16px; }
  dialog h3 { margin: 0 0 12px; font-family: Fraunces, Georgia, serif; font-weight: 600; }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin: 10px 0 4px; }
  input[type=text], input[type=email], input[type=date], input[type=time], select, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
  textarea { min-height: 64px; resize: vertical; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 600; margin-top: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dlgacts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .free-hint { font-size: 0.86rem; color: var(--brand); margin-top: 6px; }
  .demo { background: #2b2925; color: #fff; padding: 8px 12px; border-radius: 0 0 12px 12px; font-size: 0.85rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .demo button { padding: 3px 10px; font-size: 0.8rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .settings h3 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 4px 0 8px; }
  .note { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .ok { color: var(--brand); font-weight: 700; } .bad { color: var(--danger); font-weight: 700; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  @media (max-width: 520px) { h1 { font-size: 1.55rem; } .two { grid-template-columns: 1fr; } .week strong { font-size: 1rem; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="demo"></div>
  <h1 id="title">Family calendar</h1>
  <p class="hello" id="hello"></p>
  <div id="top"></div>
  <div id="main"><p class="loading">Loading…</p></div>
</div>
<dialog id="dlg"><form id="dlgform" method="dialog"></form></dialog>
<script src="config.js?v=1"></script>
<script src="mock.js?v=1"></script>
<script>
(function () {
  'use strict';
  const CFG = window.FAMCAL_CONFIG || {}, URL_ = CFG.SCRIPT_URL || '';
  const DEMO = !URL_;
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- the private link code (from #k=..., remembered on this device) ----------
  let KEY = '';
  try {
    const m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash);
    if (m) { KEY = m[1]; localStorage.setItem('famcal_k', KEY); }   // the link stays in the address, so "Add to Home Screen" keeps it
    else KEY = localStorage.getItem('famcal_k') || '';
  } catch (e) { const m = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash); KEY = m ? m[1] : ''; }
  if (DEMO && !KEY) KEY = 'demo-charlotte-key-00000000';

  // ---------- talking to the web app ----------
  async function api(fn, ...args) {
    if (DEMO) return window.FAMCAL_MOCK(fn, args);
    const r = await fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Something went wrong.');
    return j.data;
  }

  // ---------- time helpers ----------
  const pad = n => ('0' + n).slice(-2);
  const toMins = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : NaN; };
  const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  function nice(m) { if (typeof m === 'string') m = toMins(m); if (isNaN(m)) return ''; if (m >= 1440) return 'midnight'; const h = Math.floor(m / 60), mm = m % 60; return (((h + 11) % 12) + 1) + (mm ? ':' + pad(mm) : '') + (h < 12 ? 'am' : 'pm'); }
  const range = (a, b) => nice(a) + '–' + nice(b);
  const addDays = (ds, n) => { const p = ds.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10); };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function weekTitle(a, b) {
    const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
    return pa[1] === pb[1] ? pa[2] + '–' + pb[2] + ' ' + MONTHS[pb[1] - 1] : pa[2] + ' ' + MONTHS[pa[1] - 1].slice(0, 3) + ' – ' + pb[2] + ' ' + MONTHS[pb[1] - 1].slice(0, 3);
  }
  function freeWindows(day, V) {
    let free = [[V.dayStart, V.dayEnd]];
    const cut = (a, b) => { const out = []; free.forEach(f => { if (b <= f[0] || a >= f[1]) out.push(f); else { if (a > f[0]) out.push([f[0], a]); if (b < f[1]) out.push([b, f[1]]); } }); free = out; };
    day.busy.forEach(b => { if (!b.n) cut(b.s, b.e); }); day.plans.forEach(p => cut(p.s, p.e));
    return free.filter(f => f[1] - f[0] >= 30);
  }
  function freeText(day, V) {
    const f = freeWindows(day, V);
    if (!f.length) return { text: 'Busy all day', full: true };
    if (f.length === 1 && f[0][0] === V.dayStart && f[0][1] === V.dayEnd) return { text: 'Free all day', full: false };
    return { text: 'Free ' + f.map(w => w[0] === V.dayStart ? 'until ' + nice(w[1]) : w[1] === V.dayEnd ? 'from ' + nice(w[0]) : range(w[0], w[1])).join(', '), full: false };
  }

  // ---------- state ----------
  let V = null, FROM = '', TAB = 'cal', ADMIN = null;
  const boss = () => V && (V.me.role === 'admin' || V.me.role === 'full');
  const childPron = 'him';

  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }

  async function load(from) {
    try {
      V = await api('getView', KEY, from || FROM || '');
      FROM = V.from;
      render();
    } catch (e) {
      $('#main').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
    }
  }

  function unscramble(s) {
    try { const b = atob(s); let o = ''; for (let i = 0; i < b.length; i++) o += String.fromCharCode(b.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)); return o.indexOf('https://charlotte644.github.io/') === 0 ? o : ''; } catch (e) { return ''; }
  }

$1  function render() {
    document.title = V.title || 'Family Calendar';
    document.querySelector('.wrap').classList.toggle('wide', !!V.ideas && TAB === 'cal');
    $('#title').textContent = V.title || 'Family calendar';
    $('#hello').textContent = V.me.role === 'admin' ? 'Your own view: you can see everything, and only you can open Settings.' :
      V.me.role === 'full' ? 'Hi ' + V.me.name + '. You can see everything on here.' :
      'Hi ' + V.me.name + '. Here’s when ' + V.us + ' are free, where ' + V.child + ' and ' + V.dog + ' are, and the plans we’ve got together.';
    // Bigger text: on by default for family links, and anyone can switch it.
    let big = V.me.role === 'family';
    try { const s = localStorage.getItem('famcal_big'); if (s !== null) big = s === '1'; } catch (e) { /* default */ }
    document.documentElement.classList.toggle('big', big);
    // Tom's "Charlotte's Desk" button: the link is scrambled with his own key, so it never sits in this public page as plain text.
    const desk = V.me.role === 'full' ? unscramble('WRJDQkMCTktaDFNGWFoRRAQPA1AfX1BFWRNVHFlXTgdRBUBYW0ERVUxdUhdaFxpFWlsDR15VUhwMVUNcAVoLAlBKXgJSV1ADRw8=') : '';
    let top = '<div class="tools">' + (desk ? '<a class="btn small primary" href="' + esc(desk) + '" target="_blank" rel="noopener">📋 Charlotte’s Desk</a>' : '') + '<button class="small" data-big="1" aria-pressed="' + big + '">' + (big ? 'Smaller text' : 'Bigger text') + '</button>' +
      (V.me.role !== 'family' ? '<button class="small" data-card="sam">🧒 ' + esc(V.child) + '’s card</button><button class="small" data-card="nixon">🐶 ' + esc(V.dog) + '’s card</button>' : '') + '</div>';
    if (V.me.role === 'admin') top += '<div class="tabs"><button data-tab="cal" aria-pressed="' + (TAB === 'cal') + '">Calendar</button><button data-tab="set" aria-pressed="' + (TAB === 'set') + '">People &amp; settings</button></div>';
    $('#top').innerHTML = top;

  // ---------- Charlotte's things-to-do side panel ----------

  function ideasPanel() {

      ideasByMonth() + '</div>';
  }
  let IDEA_FILTER = 'all', HIDE_GOING = false;
  try { HIDE_GOING = localStorage.getItem('famcal_hidegoing') === '1'; } catch (e) { /* default */ }
  // The whole panel folds to one line. On a phone it starts folded so the calendar comes first; the choice is remembered per device.
  let HIDE_IDEAS = window.innerWidth < 960;
  try { const s = localStorage.getItem('famcal_hideideas'); if (s !== null) HIDE_IDEAS = s === '1'; } catch (e) { /* default */ }
  // Ideas grouped by month for the next 12 months (from a set date, or the first month named in "When"), then "Any time".
  const MON_RE = /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i;
  function ideaMonth(i) {
    if (i.date) return i.date.slice(0, 7);
    const m = MON_RE.exec(i.when || ''); if (!m) return '';
    const n = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'].indexOf(m[1].toLowerCase()) + 1;
    const y = +V.today.slice(0, 4), cur = +V.today.slice(5, 7);

  }
  function ideasByMonth() {
    const list = todoList(), thisMonth = V.today.slice(0, 7), last = addDays(V.today, 365).slice(0, 7), groups = {};
    list.forEach(i => { let m = ideaMonth(i); if (m && (m < thisMonth || m > last)) m = ''; (groups[m] = groups[m] || []).push(i); });

  function ideaDialog(i) {

      async fd => { await api('adminSaveIdea', KEY, { id: i.id, title: fd.get('title'), place: fd.get('place'), price: fd.get('price'), dog: fd.get('dog'), url: fd.get('url'), notes: fd.get('notes'), when: fd.get('when'), date: fd.get('date'), start: i.start || '', end: i.end || '' }); return 'Saved.'; });

  // ---------- week at a glance ----------
  const WD3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const dParts = ds => { const p = ds.split('-').map(Number), dt = new Date(Date.UTC(p[0], p[1] - 1, p[2])); return { wd: WD3[dt.getUTCDay()], num: p[2], mo: MONTHS[p[1] - 1].slice(0, 3) }; };
  function status(d) {

  function bar(d) {

      h += line('📅', 'plan', (p.open ? '<span class="open-tag">Everyone welcome</span> ' : '') + '<strong>' + esc(p.title) + '</strong> <span class="when">· ' + esc(when) + '</span>' +
        ((p.place || withTxt) ? '<div class="sub">' + [p.place ? '<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.place) + '" target="_blank" rel="noopener">' + esc(p.place) + '</a>' : '', esc(withTxt)].filter(Boolean).join(' · ') + '</div>' : '') +
        (facts ? '<div class="sub">' + facts + '</div>' : '') +
        (p.notes && !p.open && !p.price && !p.dog ? '<div class="sub">' + esc(p.notes) + '</div>' : '') +
        (p.comments ? '<div class="comments">' + p.comments.map(c => '<div><strong>' + esc(c.who) + ':</strong> ' + esc(c.text) + '</div>').join('') +
          (!d.past ? '<form class="cform" data-cplan="' + esc(p.id) + '"><input type="text" name="c" maxlength="300" placeholder="Add a note for everyone going…"><button class="small">Add</button></form>' : '') + '</div>' : ''), acts);
    });
    h += careLine('sam', d) + careLine('nixon', d);
    if (boss()) {
      const work = d.busy.filter(b => b.w), other = d.busy.filter(b => !b.w && !b.n), notes = d.busy.filter(b => b.n);
      if (work.length) h += line('💼', 'busy', '<span class="sub">' + work.map(b => esc(b.t) + ' ' + range(b.s, b.e)).join(' · ') + '</span>', '');
      (d.work || []).forEach(w => { h += line('🌴', 'busy', '<span class="sub">' + esc(w.label) + '</span>', ''); });
      const whenB = b => b.s <= 0 && b.e >= 1440 ? 'all day' : range(b.s, b.e);
      other.forEach(b => { h += line('•', 'busy', '<span class="sub">' + esc(b.t || 'Busy') + ' <span class="when">· ' + esc(whenB(b)) + '</span></span>',
        b.id && !d.past ? '<button class="link small" data-share="' + esc(b.id) + '" data-title="' + esc(b.t) + '">Share with family</button>' : ''); });
      notes.forEach(b => { h += line('🗒', 'busy', '<span class="sub">' + esc(b.t) + ' <span class="when">· ' + esc(whenB(b)) + ', note only (not busy)</span></span>', ''); });
    }
    h += '</div>';
    if (!d.past || boss()) {
      h += '<div class="dayacts"><button data-plan="' + d.date + '">＋ ' + (boss() ? 'Plan' : 'Plan something with us') + '</button>' +
        // only offered when he isn't already with someone for the whole day
        (d.sam.some(c => !c.start) ? '' : '<button data-have="sam|' + d.date + '">🧒 ' + (boss() ? 'Who has ' + esc(V.child) : 'I’ll have ' + esc(V.child)) + '</button>') +
        (d.nixon.some(c => !c.start) ? '' : '<button data-have="nixon|' + d.date + '">🐶 ' + (boss() ? 'Who has ' + esc(V.dog) : 'I’ll have ' + esc(V.dog)) + '</button>') +
        ((V.workers || []).length ? '<button data-work="' + d.date + '">💼 ' + (V.me.role === 'admin' ? 'Leave / overtime' : 'Overtime / off') + '</button>' : '') +
        // Tom: one-tap overtime on top of today's hours, or a one-tap shift on a day he isn't working
        (V.me.role === 'full' && !d.past ? (d.myWork ? [60, 120, 180].map(m => '<button class="ot" data-ot="' + d.date + '|' + d.myWork.s + '|' + (d.myWork.e + m) + '">+' + (m / 60) + 'h</button>').join('')
          : '<button class="ot" data-ot="' + d.date + '|420|960">Shift 7am–4pm</button>') : '') + '</div>';
    }
    return h + '</div></article>';
  }

  // ---------- dialogs ----------

  // ---------- add one plan to your own calendar ----------
  function addCalDialog(p) {
    const ymd = p.date.replace(/-/g, ''), stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const s = p.start ? ymd + 'T' + p.start.replace(':', '') + '00' : ymd, e = p.start ? ymd + 'T' + (p.end || hhmm(p.s + 60)).replace(':', '') + '00' : addDays(p.date, 1).replace(/-/g, '');
    const title = boss() ? p.title : p.title + ' with ' + V.us;
    const g = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title) + '&dates=' + s + '/' + e + '&ctz=Europe/London' +
      (p.place ? '&location=' + encodeURIComponent(p.place) : '') + (p.notes ? '&details=' + encodeURIComponent(p.notes) : '');
    const icsEsc = t => String(t || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Family calendar//EN', 'BEGIN:VEVENT', 'UID:' + p.id + '@family-calendar', 'DTSTAMP:' + stamp,
      p.start ? 'DTSTART;TZID=Europe/London:' + s : 'DTSTART;VALUE=DATE:' + s, p.start ? 'DTEND;TZID=Europe/London:' + e : 'DTEND;VALUE=DATE:' + e,
      'SUMMARY:' + icsEsc(title)].concat(p.place ? ['LOCATION:' + icsEsc(p.place)] : []).concat(p.notes ? ['DESCRIPTION:' + icsEsc(p.notes)] : []).concat(['END:VEVENT', 'END:VCALENDAR']).join('\r\n');
    const href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    openDialog('<h3>Add to my calendar</h3><p>' + esc(p.title) + '<br><span class="sub">' + esc(p.start ? range(p.s, p.e) : 'All day') + '</span></p>' +
      '<div class="row"><a class="btn" target="_blank" rel="noopener" href="' + esc(g) + '">Google Calendar</a><a class="btn" href="' + href + '" download="plan.ics">iPhone, Apple or Outlook</a></div>' +
      '<p class="sub">Tip: “Put this on your own calendar” at the top adds every plan for you, and keeps them up to date.</p>' +
      '<div class="dlgacts"><button type="button" data-close>Done</button></div>', async () => '');
  }

  // ---------- clicks ----------
  document.addEventListener('click', async ev => {
    const t = ev.target.closest('button, a'); if (!t) return;
    const ds = t.dataset;
    if (ds.tab) { TAB = ds.tab; if (TAB === 'set') ADMIN = null; render(); return; }
    if (ds.go === 'back') return load(addDays(FROM, -7));
    if (ds.go === 'next') return load(addDays(FROM, 7));
    if (ds.go === 'today') return load(V.today);
    if (ds.copy) { try { await navigator.clipboard.writeText(ds.copy); toast('Copied.'); } catch (e) { prompt('Copy this:', ds.copy); } return; }
    const findPlan = id => { for (const d of V.days) { const p = d.plans.find(x => x.id === id); if (p) return p; } return null; };
    if (ds.plan) return planDialog(ds.plan, null);
    if (ds.move) return planDialog(null, findPlan(ds.move));
    if (ds.addcal) return addCalDialog(findPlan(ds.addcal));
    if (ds.cancel) {
      const p = findPlan(ds.cancel);
      return confirmDialog('Cancel this plan?', '<strong>' + esc(p.title) + '</strong><br>' + esc(V.days.find(d => d.date === p.date).label) + ', ' + esc(p.start ? range(p.s, p.e) : 'all day'), { text: 'Yes, cancel it' },
        async () => { await api('cancelPlan', KEY, p.id); return 'Cancelled.'; });
    }
    if (ds.have) { const a = ds.have.split('|'); return haveDialog(a[0], a[1]); }
    if (ds.work) return workDialog(ds.work);
    if (ds.big) { const on = !document.documentElement.classList.contains('big'); try { localStorage.setItem('famcal_big', on ? '1' : '0'); } catch (e) { } render(); return; }
    if (ds.card) return cardDialog(ds.card);
    if (ds.need) return needDialog();
    if (ds.needdone) { t.disabled = true; try { await api('doneNeed', KEY, ds.needdone); await load(FROM); } catch (e) { toast(e.message); } return; }
    if (ds.ifilter) { IDEA_FILTER = ds.ifilter; render(); return; }
    if (ds.hideideas) { HIDE_IDEAS = !HIDE_IDEAS; try { localStorage.setItem('famcal_hideideas', HIDE_IDEAS ? '1' : '0'); } catch (e) { } render(); return; }
    if (ds.hidegoing) { HIDE_GOING = !HIDE_GOING; try { localStorage.setItem('famcal_hidegoing', HIDE_GOING ? '1' : '0'); } catch (e) { } render(); return; }
    if (ds.open) {
      const a = ds.open.split('|'); t.disabled = true;
      try { await api('adminSetOpen', KEY, a[0], a[1] === '1'); toast(a[1] === '1' ? 'Everyone can now see it and join.' : 'Now it’s just us.'); await load(FROM); } catch (e) { toast(e.message); }
      return;
    }
    if (ds.ot) {
      const a = ds.ot.split('|'), s = +a[1], e = Math.min(+a[2], 1439); t.disabled = true;
      try { await api('setWork', KEY, { date: a[0], mode: 'hours', start: hhmm(s), end: hhmm(e), reason: e - s > 540 ? 'overtime' : 'shift' }); toast('Saved: ' + range(s, e) + '.'); await load(FROM); } catch (er) { toast(er.message); t.disabled = false; }
      return;
    }
    const findIdea = id => (V.ideas || []).find(i => i.id === id);
    if (ds.newIdea) return ideaDialog(null);
    if (ds.editIdea) return ideaDialog(findIdea(ds.editIdea));
    if (ds.goIdea) return goDialog(findIdea(ds.goIdea));
    if (ds.rmIdea) {
      const i = findIdea(ds.rmIdea);
      return confirmDialog('Remove this idea?', '<strong>' + esc(i.title) + '</strong>', { text: 'Remove' }, async () => { await api('adminRemoveIdea', KEY, i.id); return 'Removed.'; });
    }
    if (ds.goto) return load(ds.goto);
    if (ds.join || ds.leave) {
      t.disabled = true;
      try { await api('joinPlan', KEY, ds.join || ds.leave, !!ds.join); toast(ds.join ? 'Lovely, see you there!' : 'No problem, we’ve taken you off.'); await load(FROM); }
      catch (e) { toast(e.message); t.disabled = false; }
      return;
    }
    if (ds.share) {
      return openDialog('<h3>Share with family</h3><p><strong>' + esc(ds.title) + '</strong></p><p class="sub">They’ll see it as a plan with you (and can add it to their calendar). It stays in your own calendar as it is.</p>' +
        peopleBoxes([]) + '<label>Note for them <span class="sub">(optional)</span></label><input type="text" name="notes" maxlength="200">' +
        '<div class="dlgacts"><button type="button" data-close>Back</button><button class="primary" type="submit">Share</button></div>',
        async fd => { await api('adminLinkEvent', KEY, { eventId: ds.share, people: fd.getAll('people'), notes: fd.get('notes') }); return 'Shared.'; });
    }
    if (ds.drop) {
      const a = ds.drop.split('|'), name = a[0] === 'sam' ? V.child : V.dog, label = V.days.find(d => d.date === a[1]).label;
      return confirmDialog('Can’t have ' + name + '?', 'No problem. We’ll take ' + name + ' off ' + esc(label) + (boss() ? '' : ' and we’ll get an email to say so') + '.', { text: 'Yes, take it off', note: true },
        async fd => { await api('dropCare', KEY, { kind: a[0], date: a[1], person: a[2], id: a[3], notes: fd.get('notes') || '' }); return 'Done.'; });
    }
    if (ds.newlink) {
      if (!confirm('Give ' + ds.name + ' a new link? Their old link will stop working straight away.')) return;
      ADMIN = await api('adminNewLink', KEY, ds.newlink); renderSettings(); toast('New link made. Copy it and send it to them.'); return;
    }
    if (ds.addrow) { ADMIN.pattern.push({ kind: 'sam', weekday: 1, person: (ADMIN.people[0] || {}).id, start: '', end: '', from: '', until: '' }); renderSettings(); return; }
    if (ds.delrow) { ADMIN.pattern.splice(+ds.delrow, 1); renderSettings(); return; }
    if (ds.addwork) { ADMIN.routine.push({ who: 'charlotte', weekday: 1, start: '09:00', end: '17:00', label: '' }); renderSettings(); return; }
    if (ds.delwork) { ADMIN.routine.splice(+ds.delwork, 1); renderSettings(); return; }
  });

  // ---------- Charlotte's settings ----------
  const WEEKDAYS = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    calendar_ids: 'Calendars that make us busy', ignore_words: 'Never count events containing', allday_busy: 'All-day events make the day busy (yes/no)', day_start: 'Day starts', day_end: 'Day ends', weeks_ahead: 'Weeks ahead family can see', site_url: 'Address of this page',

  const ROTAS = ['', '1/2', '2/2', '1/3', '2/3', '3/3', '1/4', '2/4', '3/4', '4/4'];
  async function renderSettings() {

      $('#main').innerHTML = '<p class="loading">Loading…</p>';

    let h = '<div class="panel settings"><h3>People with a link</h3><p class="sub">Each person (or couple) has one private link. Nobody needs a password. Put several email addresses separated by commas, e.g. both Nanay’s and Tatay’s: everyone listed gets the updates. “Sees everything” shows what your busy times are (for Tom).</p><table>';
    A.people.forEach(p => {
      const place = p.role === 'place';
      h += '<tr data-person="' + esc(p.id) + '"><td style="min-width:150px"><input type="text" name="name" value="' + esc(p.name) + '"><div class="note">' + (p.active || place ? '' : '<span class="bad">Link switched off</span>') + '</div></td>' +
        '<td><input type="text" inputmode="email" name="email" value="' + esc(p.email) + '" placeholder="' + (place ? 'not needed' : 'emails for updates, separated by commas') + '">' + roles(p.role) +
        '<label class="check" style="margin-top:6px;font-weight:400"' + (place ? ' hidden' : '') + '><input type="checkbox" name="active" ' + (p.active ? 'checked' : '') + '> Link works</label></td>' +
        '<td><div class="row" style="flex-direction:column;align-items:stretch"><button class="small primary" data-saveperson="' + esc(p.id) + '">Save</button>' +
        (place ? '' : '<button class="small" data-copy="' + esc(base + '#k=' + p.token) + '">Copy link</button><button class="small" data-newlink="' + esc(p.id) + '" data-name="' + esc(p.name) + '">New link</button>') + '</div></td></tr>';
    });
    h += '<tr data-person=""><td><input type="text" name="name" placeholder="New person, e.g. Auntie Jo"></td><td><input type="text" inputmode="email" name="email" placeholder="emails (optional), separated by commas">' + roles('family') + '<input type="checkbox" name="active" checked hidden></td><td><button class="small primary" data-saveperson="">Add</button></td></tr></table></div>';

    h += '<div class="panel settings"><h3>Usual work hours</h3><p class="sub">These count as busy (not on bank holidays). Change a single day (overtime, annual leave) with the “Work” button on that day instead. For a rotating pattern, e.g. earlies one week and lates the next, add both and set “Week 1 of 2” / “Week 2 of 2” (week 1 starts on the date in Settings).</p><table>';
    A.routine.forEach((r, i) => {
      h += '<tr data-rt="' + i + '"><td><select name="who">' + A.workers.map(w => '<option value="' + esc(w.id) + '"' + (r.who === w.id ? ' selected' : '') + '>' + esc(w.name) + '</option>').join('') + '</select></td>' +
        '<td><select name="weekday">' + WEEKDAYS.slice(1).map((w, j) => '<option value="' + (j + 1) + '"' + (r.weekday === j + 1 ? ' selected' : '') + '>' + w + '</option>').join('') + '</select></td>' +
        '<td><input type="time" name="start" value="' + esc(r.start) + '" step="900"><input type="time" name="end" value="' + esc(r.end) + '" step="900" style="margin-top:4px"></td>' +
        '<td><input type="text" name="label" value="' + esc(r.label) + '" placeholder="e.g. Tom at work"><select name="rota" style="margin-top:4px">' +
        ROTAS.map(x => '<option value="' + x + '"' + ((r.rota || '') === x ? ' selected' : '') + '>' + (x ? 'Week ' + x.replace('/', ' of ') : 'Every week') + '</option>').join('') + '</select></td>' +
        '<td><button class="small danger" data-delwork="' + i + '" aria-label="Remove">✕</button></td></tr>';
    });
    h += '</table><div class="row" style="margin-top:10px"><button class="small" data-addwork="1">+ Add a day</button><button class="small primary" data-saveroutine="1">Save work hours</button></div></div>';

    h += '<div class="panel settings"><h3>Usual week</h3><p class="sub">Who normally has ' + esc(A.settings.child_name) + ' or ' + esc(A.settings.dog_name) + ' each week. Leave the times blank for all day, and the dates blank if there is no start or end. Family can say “can’t have him this time” for one day without changing this.</p><table>';
    A.pattern.forEach((r, i) => {
      h += '<tr data-pat="' + i + '"><td><select name="kind"><option value="sam"' + (r.kind === 'sam' ? ' selected' : '') + '>' + esc(A.settings.child_name) + '</option><option value="nixon"' + (r.kind === 'nixon' ? ' selected' : '') + '>' + esc(A.settings.dog_name) + '</option></select></td>' +
        '<td><select name="weekday">' + WEEKDAYS.slice(1).map((w, j) => '<option value="' + (j + 1) + '"' + (r.weekday === j + 1 ? ' selected' : '') + '>' + w + '</option>').join('') + '</select></td>' +
        '<td><select name="person">' + A.people.map(p => '<option value="' + esc(p.id) + '"' + (r.person === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></td>' +
        '<td><input type="time" name="start" value="' + esc(r.start) + '" step="900"><input type="time" name="end" value="' + esc(r.end) + '" step="900" style="margin-top:4px"></td>' +
        '<td><label class="note" style="margin:0">Starts</label><input type="date" name="from" value="' + esc(r.from || '') + '"><label class="note" style="margin:4px 0 0">Ends</label><input type="date" name="until" value="' + esc(r.until || '') + '">' +
        '<label class="check" style="margin-top:4px;font-weight:400"><input type="checkbox" name="overnight"' + (r.overnight ? ' checked' : '') + '> Overnight</label></td>' +
        '<td><button class="small danger" data-delrow="' + i + '" aria-label="Remove">✕</button></td></tr>';
    });
    h += '</table><div class="row" style="margin-top:10px"><button class="small" data-addrow="1">+ Add a day</button><button class="small primary" data-savepattern="1">Save usual week</button></div></div>';

    // Care cards
    ['sam', 'nixon'].forEach(kind => {
      h += '<div class="panel settings"><h3>' + (kind === 'sam' ? '🧒 ' + esc(A.settings.child_name) : '🐶 ' + esc(A.settings.dog_name)) + '’s care card</h3><p class="sub">Everyone with a link can read this (Tom, Nanay &amp; Tatay, Nana and anyone you add). Leave a box empty to hide it.</p>';
      A.cards[kind].forEach(s => { h += '<label>' + esc(s.section) + '</label><textarea data-card-kind="' + kind + '" data-section="' + esc(s.section) + '" rows="2">' + esc(s.text) + '</textarea>'; });
      h += '<div class="row" style="margin-top:10px"><button class="small primary" data-savecard="' + kind + '">Save care card</button></div></div>';
    });
    // Birthdays and anniversaries
    h += '<div class="panel settings"><h3>Birthdays &amp; anniversaries</h3><p class="sub">Everyone sees these on the day. Put the year in to show the age (or blank the year: e.g. 03-14). Gift ideas are only ever shown to you.</p><table>';
    (A.birthdays.length ? A.birthdays : []).concat([{ id: '', name: '', date: '', kind: 'birthday', gift: '' }]).forEach(b => {
      h += '<tr data-bday="' + esc(b.id) + '"><td><input type="text" name="name" value="' + esc(b.name) + '" placeholder="e.g. Nana"></td>' +
        '<td><input type="text" name="date" value="' + esc(b.date) + '" placeholder="YYYY-MM-DD or MM-DD"><select name="kind" style="margin-top:4px"><option value="birthday">Birthday</option><option value="anniversary"' + (b.kind === 'anniversary' ? ' selected' : '') + '>Anniversary</option></select></td>' +
        '<td><input type="text" name="gift" value="' + esc(b.gift) + '" placeholder="Gift idea (only you see this)"></td></tr>';
    });
    h += '</table><div class="row" style="margin-top:10px"><button class="small primary" data-savebdays="1">Save birthdays</button><span class="sub">The last row is for adding a new one. Clear a name to remove it.</span></div></div>';

    h += '<div class="panel settings"><h3>Settings</h3>';
    Object.keys(SETTING_LABELS).forEach(k => {
      h += '<label>' + esc(SETTING_LABELS[k]) + '</label><input type="text" data-setting="' + k + '" value="' + esc(A.settings[k]) + '">' + (A.notes[k] ? '<div class="note">' + esc(A.notes[k]) + '</div>' : '');
    });
    h += '<p style="margin:14px 0 6px"><strong>Calendar check</strong></p>' + A.calendars.map(c => '<div>' + (c.ok ? '<span class="ok">✓</span> ' : '<span class="bad">✕</span> ') + esc(c.id) + (c.ok ? ' <span class="sub">(' + esc(c.name) + ')</span>' : ' <span class="sub">— not shared with this Google account yet</span>') + '</div>').join('');
    h += '<div class="row" style="margin-top:12px"><button class="primary small" data-savesettings="1">Save settings</button></div>';
    h += '<p class="sub">Your own link (keep it private): <button class="link small" data-copy="' + esc(base + '#k=' + KEY) + '">copy</button></p></div>';
    $('#main').innerHTML = h;
  }
  document.addEventListener('click', async ev => {
    const t = ev.target.closest('button'); if (!t || !ADMIN) return;
    try {
      if (t.dataset.saveperson !== undefined) {
        const tr = t.closest('tr'), g = n => tr.querySelector('[name=' + n + ']');
        ADMIN = await api('adminSavePerson', KEY, { id: t.dataset.saveperson, name: g('name').value, email: g('email').value, role: g('role').value, active: g('active').checked });
        renderSettings(); toast('Saved.');
      } else if (t.dataset.savepattern) {
        const rows = [...document.querySelectorAll('tr[data-pat]')].map(tr => { const g = n => tr.querySelector('[name=' + n + ']').value; return { kind: g('kind'), weekday: +g('weekday'), person: g('person'), start: g('start'), end: g('end'), from: g('from'), until: g('until'), overnight: tr.querySelector('[name=overnight]').checked }; });
        ADMIN = await api('adminSavePattern', KEY, rows); renderSettings(); toast('Usual week saved.'); V = null; await loadQuiet();
      } else if (t.dataset.saveroutine) {
        const rows = [...document.querySelectorAll('tr[data-rt]')].map(tr => { const g = n => tr.querySelector('[name=' + n + ']').value; return { who: g('who'), weekday: +g('weekday'), start: g('start'), end: g('end'), label: g('label'), rota: g('rota') }; });
        ADMIN = await api('adminSaveRoutine', KEY, rows); renderSettings(); toast('Work hours saved.'); await loadQuiet();
      } else if (t.dataset.savecard) {
        const kind = t.dataset.savecard, secs = [...document.querySelectorAll('[data-card-kind="' + kind + '"]')].map(x => ({ section: x.dataset.section, text: x.value }));
        ADMIN.cards = await api('adminSaveCard', KEY, kind, secs); toast('Care card saved.'); await loadQuiet();
      } else if (t.dataset.savebdays) {
        const rows = [...document.querySelectorAll('tr[data-bday]')].map(tr => { const g = n => tr.querySelector('[name=' + n + ']').value; return { id: tr.dataset.bday, name: g('name'), date: g('date').trim(), kind: g('kind'), gift: g('gift') }; }).filter(r => r.name.trim());
        ADMIN = await api('adminSaveBirthdays', KEY, rows); renderSettings(); toast('Birthdays saved.'); await loadQuiet();
      } else if (t.dataset.savesettings) {
        const o = {}; document.querySelectorAll('[data-setting]').forEach(i => { o[i.dataset.setting] = i.value; });
        ADMIN = await api('adminSaveSettings', KEY, o); renderSettings(); toast('Settings saved.'); await loadQuiet();
      }
    } catch (e) { toast(e.message); }
  });
  // Notes on a plan (people going only, no notifications).
  document.addEventListener('submit', async ev => {
    const f = ev.target.closest && ev.target.closest('form.cform'); if (!f) return;
    ev.preventDefault();
    const v = f.c.value.trim(); if (!v) return;
    f.querySelector('button').disabled = true;
    try { await api('addComment', KEY, f.dataset.cplan, v); await load(FROM); } catch (e) { toast(e.message); f.querySelector('button').disabled = false; }
  });
  // Jump straight to any date (Charlotte and Tom).
  document.addEventListener('change', ev => { if (ev.target.matches && ev.target.matches('[data-jump]') && ev.target.value) load(ev.target.value); });
  // Keep the pattern rows in memory while editing, so "+ Add a day" does not lose changes.
  document.addEventListener('change', ev => {
    const tr = ev.target.closest && ev.target.closest('tr[data-pat], tr[data-rt]'); if (!tr || !ADMIN) return;
    const r = tr.dataset.pat !== undefined ? ADMIN.pattern[+tr.dataset.pat] : ADMIN.routine[+tr.dataset.rt], n = ev.target.name; if (!r) return;
    r[n] = n === 'weekday' ? +ev.target.value : ev.target.value;
  });
  async function loadQuiet() { try { V = await api('getView', KEY, FROM); } catch (e) { /* page shows the error next time */ } }

  // ---------- start ----------
  if (!KEY) { $('#main').innerHTML = '<div class="msg">Please open this page using the personal link you were sent.</div>'; return; }
  window.FAMCAL_RELOAD = k => { KEY = k; TAB = 'cal'; ADMIN = null; FROM = ''; load(); };
  load();
})();
</script>
</body>
</html>
